<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark">
    <title>Тренажер аккордов на слух</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Базовые стили (fallback) на случай блокировки CDN Tailwind в iOS Safari */
        html, body { 
            background-color: #0f172a !important; 
            color: #f1f5f9 !important; 
        }
        body { font-family: 'Inter', sans-serif; }
        
        /* Убираем синюю подсветку при тапе на мобильных (iOS/Android) */
        * { -webkit-tap-highlight-color: transparent; }
        
        /* Кросс-браузерные кастомные скроллбары */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }

        /* Кросс-браузерный ползунок громкости (Range Slider) */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        input[type=range]::-moz-range-thumb {
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; background: #475569;
            border-radius: 2px;
        }
        input[type=range]::-moz-range-track {
            width: 100%; height: 4px;
            cursor: pointer; background: #475569;
            border-radius: 2px;
        }

        /* Кросс-браузерные выпадающие списки (Select) */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 0.5rem top 50%;
            background-size: 0.65rem auto;
        }

        /* Кросс-браузерные чекбоксы */
        input[type="checkbox"].custom-cb {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-color: #1e293b;
            margin: 0;
            color: currentColor;
            width: 14px;
            height: 14px;
            border: 1px solid #475569;
            border-radius: 3px;
            display: grid;
            place-content: center;
            cursor: pointer;
        }
        input[type="checkbox"].custom-cb::before {
            content: "";
            width: 8px;
            height: 8px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            background-color: #4f46e5;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        input[type="checkbox"].custom-cb:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between overflow-hidden selection:bg-indigo-500 selection:text-white">

    <header class="w-full bg-slate-800 border-b border-slate-700 py-2 px-4 shadow-sm shrink-0">
        <div class="max-w-7xl mx-auto flex flex-row justify-between items-center">
            <h1 class="text-sm font-bold tracking-tight text-indigo-400 flex items-center gap-1.5">
                🎵 Тренажер Аккордов
            </h1>
            <div class="text-[11px] text-slate-400">
                Развитие слуха
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-2 overflow-hidden">
        <div class="w-full max-w-5xl bg-slate-800/90 border border-slate-700 rounded-xl shadow-lg p-3 sm:p-4 flex flex-col justify-between h-full max-h-[calc(100vh-50px)] gap-2">
            
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/60 shrink-0">
                <!-- Voicing setting -->
                <div>
                    <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Изложение</label>
                    <select id="voicingSelect" class="w-full bg-slate-800 border border-slate-600 rounded pl-2 pr-6 py-1 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="melodic_layered" selected>Мелодич. с наслоением</option>
                        <option value="melodic">Мелодическое</option>
                        <option value="harmonic">Гармоническое</option>
                    </select>
                </div>

                <!-- Tempo setting (Default: Very slow 0.6s) -->
                <div>
                    <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Темп арпеджио</label>
                    <select id="tempoSelect" class="w-full bg-slate-800 border border-slate-600 rounded pl-2 pr-6 py-1 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="very_slow" selected>Очень медленный (0.6с)</option>
                        <option value="slow">Медленный (0.4с)</option>
                        <option value="normal">Умеренный (0.25с)</option>
                        <option value="fast">Быстрый (0.15с)</option>
                    </select>
                </div>

                <!-- Root Note setting -->
                <div>
                    <label class="block text-[10px] font-medium text-slate-400 mb-0.5">Основной тон</label>
                    <select id="rootSelect" class="w-full bg-slate-800 border border-slate-600 rounded pl-2 pr-6 py-1 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="random">Случайный</option>
                        <option value="C">До (C)</option>
                        <option value="D">Ре (D)</option>
                        <option value="E">Ми (E)</option>
                        <option value="F">Фа (F)</option>
                        <option value="G">Соль (G)</option>
                        <option value="A">Ля (A)</option>
                        <option value="B">Си (B)</option>
                    </select>
                </div>

                <!-- Master Volume Slider -->
                <div>
                    <div class="flex justify-between text-[10px] font-medium text-slate-400 mb-0.5">
                        <span>Громкость</span>
                        <span id="volumeLabel">80%</span>
                    </div>
                    <div class="h-[26px] flex items-center px-1 bg-slate-800/80 border border-slate-600 rounded">
                        <input type="range" id="volumeSlider" min="0" max="100" value="80" class="w-full cursor-pointer">
                    </div>
                </div>
            </div>

            <div id="chordSettingsModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3">
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 max-w-2xl w-full space-y-3 shadow-xl">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Выберите аккорды для тренировки</h3>
                        <div class="flex gap-2 text-xs">
                            <button id="selectAllBtn" class="text-indigo-400 hover:underline">Выбрать все</button>
                            <span class="text-slate-600">|</span>
                            <button id="deselectAllBtn" class="text-slate-400 hover:underline">Снять все</button>
                        </div>
                    </div>
                    <div id="chordTypesContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs max-h-[55vh] overflow-y-auto pr-1">
                        <!-- Filled dynamically via JS -->
                    </div>
                    <div class="flex justify-end pt-2 border-t border-slate-700">
                        <button id="closeSettingsBtn" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-semibold shadow">Начать тренировку</button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-between gap-2 bg-slate-900/30 p-2.5 rounded-lg border border-slate-700/40 shrink-0">
                <div class="flex items-center gap-2 w-full sm:w-auto justify-center">
                    <button id="playBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-lg shadow transition transform active:scale-95 flex items-center gap-1.5 text-xs">
                        ▶️ Сыграть аккорд
                    </button>
                    <button id="repeatBtn" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-indigo-300 font-semibold rounded-lg shadow transition transform active:scale-95 flex items-center gap-1 text-xs border border-slate-600">
                        🔁 Повторить
                    </button>
                    <button id="toggleSettingsBtn" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-indigo-300 font-medium rounded-lg text-xs border border-slate-600 transition flex items-center gap-1">
                        ⚙️ Выбор (<span id="activeCountBadge">22</span>)
                    </button>
                </div>
                
                <!-- Feedback Box -->
                <div id="feedbackBox" class="hidden px-3 py-1.5 rounded-lg text-xs font-medium text-center transition flex-grow max-w-md">
                    <!-- Dynamic feedback -->
                </div>

                <div class="text-[11px] text-slate-400 font-medium hidden sm:block">
                    Выберите ответ ниже ↓
                </div>
            </div>

            <div class="space-y-1.5 flex-grow flex flex-col justify-center overflow-hidden">
                <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider text-center">Варианты ответов:</div>
                <div id="answersContainer" class="space-y-1.5 overflow-y-auto pr-1">
                    <!-- Dynamic answer buttons grouped by categories -->
                </div>
            </div>

            <div class="pt-2 border-t border-slate-700 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-400 gap-1.5 shrink-0">
                <div class="flex gap-3 items-center text-[11px]">
                    <div>Верно: <span id="correctCount" class="font-bold text-emerald-400">0</span></div>
                    <div>Всего: <span id="totalCount" class="font-bold text-slate-200">0</span></div>
                    <div>Точность: <span id="accuracyCount" class="font-bold text-indigo-400">0%</span></div>
                    <button id="toggleDetailedStats" class="text-indigo-400 hover:underline">Статистика</button>
                    <button id="resetStatsBtn" class="hover:text-slate-200 underline">Сбросить</button>
                </div>

                <!-- History of last answers -->
                <div class="flex items-center gap-1 overflow-x-auto max-w-xs pb-0.5">
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider mr-1">История:</span>
                    <div id="historyContainer" class="flex gap-1 items-center">
                        <span class="text-[10px] text-slate-500 italic">Нет ответов...</span>
                    </div>
                </div>
            </div>

            <div id="detailedStatsBox" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3">
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 max-w-xl w-full space-y-3 shadow-xl">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <h3 class="text-xs font-bold text-indigo-400 uppercase">Статистика по каждому аккорду</h3>
                        <button id="closeStatsModalBtn" class="text-slate-400 hover:text-white text-xs font-bold">✕</button>
                    </div>
                    <div id="detailedStatsList" class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs max-h-52 overflow-y-auto pr-1">
                        <!-- Filled via JS -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const CHORD_CATEGORIES = {
            'Трезвучия': {
                'triad_maj': { name: 'Мажорное трезвучие', short: 'Б<sub>5</sub>', rawShort: 'Б5', intervals: [0, 4, 7] },
                'triad_min': { name: 'Минорное трезвучие', short: 'М<sub>5</sub>', rawShort: 'М5', intervals: [0, 3, 7] },
                'triad_dim': { name: 'Уменьшенное трезвучие', short: 'Ум<sub>5</sub>', rawShort: 'Ум5', intervals: [0, 3, 6] },
                'triad_aug': { name: 'Увеличенный аккорд', short: 'Ув<sub>5</sub>', rawShort: 'Ув5', intervals: [0, 4, 8] }
            },
            'Обращения трезвучий': {
                'inv_maj_6': { name: 'Мажорный секстаккорд', short: 'Б<sub>6</sub>', rawShort: 'Б6', intervals: [0, 3, 8] },
                'inv_maj_64': { name: 'Мажорный квартсекстаккорд', short: 'Б<span class="inline-flex flex-col text-[8px] leading-none align-middle ml-0.5"><span>6</span><span>4</span></span>', rawShort: 'Б6/4', intervals: [0, 5, 9] },
                'inv_min_6': { name: 'Минорный секстаккорд', short: 'М<sub>6</sub>', rawShort: 'М6', intervals: [0, 4, 9] },
                'inv_min_64': { name: 'Минорный квартсекстаккорд', short: 'М<span class="inline-flex flex-col text-[8px] leading-none align-middle ml-0.5"><span>6</span><span>4</span></span>', rawShort: 'М6/4', intervals: [0, 5, 8] }
            },
            'Септаккорды': {
                'mb7': { name: 'Малый мажорный септаккорд', short: 'МБ<sub>7</sub>', rawShort: 'МБ7', intervals: [0, 4, 7, 10] },
                'bb7': { name: 'Большой мажорный септаккорд', short: 'ББ<sub>7</sub>', rawShort: 'ББ7', intervals: [0, 4, 7, 11] },
                'mm7': { name: 'Малый минорный септаккорд', short: 'ММ<sub>7</sub>', rawShort: 'ММ7', intervals: [0, 3, 7, 10] },
                'bm7': { name: 'Большой минорный септаккорд', short: 'БМ<sub>7</sub>', rawShort: 'БМ7', intervals: [0, 3, 7, 11] },
                'm7b5': { name: 'Полууменьшенный септаккорд', short: 'Мø<sub>7</sub>', rawShort: 'Мø7', intervals: [0, 3, 6, 10] },
                'dim7': { name: 'Уменьшенный септаккорд', short: 'УМ<sub>7</sub>', rawShort: 'УМ7', intervals: [0, 3, 6, 9] },
                'aug7': { name: 'Увеличенный септаккорд', short: 'УВ<sub>7</sub>', rawShort: 'УВ7', intervals: [0, 4, 8, 11] }
            },
            'Обращения D7': {
                'dom7': { name: 'Доминантсептаккорд', short: 'D<sub>7</sub>', rawShort: 'D7', intervals: [0, 4, 7, 10] },
                'dom65': { name: 'Квинтсекстаккорд', short: 'D<span class="inline-flex flex-col text-[8px] leading-none align-middle ml-0.5"><span>6</span><span>5</span></span>', rawShort: 'D6/5', intervals: [0, 3, 6, 8] },
                'dom43': { name: 'Терцквартаккорд', short: 'D<span class="inline-flex flex-col text-[8px] leading-none align-middle ml-0.5"><span>4</span><span>3</span></span>', rawShort: 'D4/3', intervals: [0, 3, 5, 9] },
                'dom2': { name: 'Секундаккорд', short: 'D<sub>2</sub>', rawShort: 'D2', intervals: [0, 2, 6, 9] }
            }
        };

        const ALL_CHORDS = {};
        for (const cat in CHORD_CATEGORIES) {
            for (const key in CHORD_CATEGORIES[cat]) {
                ALL_CHORDS[key] = CHORD_CATEGORIES[cat][key];
            }
        }

        const NOTE_OFFSETS = {
            'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
            'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8,
            'Ab': 8, 'A': 9, 'A#': 10, 'Bb': 10, 'B': 11
        };

        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        let audioCtx = null;
        let currentChord = null;
        let currentRoot = null;
        let stats = { correct: 0, total: 0 };
        let chordStats = {}; 
        let history = []; 
        let canAnswer = false;
        let activeNodes = []; 

        for (const key in ALL_CHORDS) {
            chordStats[key] = { correct: 0, total: 0 };
        }

        const voicingSelect = document.getElementById('voicingSelect');
        const tempoSelect = document.getElementById('tempoSelect');
        const rootSelect = document.getElementById('rootSelect');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeLabel = document.getElementById('volumeLabel');
        const chordTypesContainer = document.getElementById('chordTypesContainer');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const playBtn = document.getElementById('playBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const feedbackBox = document.getElementById('feedbackBox');
        const correctCountEl = document.getElementById('correctCount');
        const totalCountEl = document.getElementById('totalCount');
        const accuracyCountEl = document.getElementById('accuracyCount');
        const resetStatsBtn = document.getElementById('resetStatsBtn');
        const toggleDetailedStats = document.getElementById('toggleDetailedStats');
        const detailedStatsBox = document.getElementById('detailedStatsBox');
        const closeStatsModalBtn = document.getElementById('closeStatsModalBtn');
        const detailedStatsList = document.getElementById('detailedStatsList');
        const historyContainer = document.getElementById('historyContainer');
        const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
        const chordSettingsModal = document.getElementById('chordSettingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const activeCountBadge = document.getElementById('activeCountBadge');

        volumeSlider.oninput = (e) => {
            volumeLabel.textContent = e.target.value + '%';
        };

        toggleSettingsBtn.onclick = () => chordSettingsModal.classList.remove('hidden');
        closeSettingsBtn.onclick = () => {
            chordSettingsModal.classList.add('hidden');
            updateActiveBadge();
            renderAnswerButtons();
            prepareNewQuestion();
        };

        toggleDetailedStats.onclick = () => detailedStatsBox.classList.remove('hidden');
        closeStatsModalBtn.onclick = () => detailedStatsBox.classList.add('hidden');

        function updateActiveBadge() {
            const count = getActiveChordTypes().length;
            activeCountBadge.textContent = count;
        }

        function initChordCheckboxes() {
            chordTypesContainer.innerHTML = '';
            for (const [catName, chords] of Object.entries(CHORD_CATEGORIES)) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'bg-slate-900/40 p-2.5 rounded-lg border border-slate-700/50 space-y-1.5 flex flex-col justify-between';
                
                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex justify-between items-center border-b border-slate-700/60 pb-1';
                
                const titleEl = document.createElement('div');
                titleEl.className = 'text-[11px] font-semibold text-indigo-400 uppercase tracking-wider';
                titleEl.textContent = catName;
                headerDiv.appendChild(titleEl);

                const catToggleBtn = document.createElement('button');
                catToggleBtn.className = 'text-[10px] text-indigo-300 hover:text-white underline';
                catToggleBtn.textContent = 'Вкл / Выкл';
                catToggleBtn.onclick = () => {
                    const checkboxes = groupDiv.querySelectorAll('.chord-checkbox');
                    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                    checkboxes.forEach(cb => cb.checked = !allChecked);
                    updateActiveBadge();
                };
                headerDiv.appendChild(catToggleBtn);
                groupDiv.appendChild(headerDiv);

                const listDiv = document.createElement('div');
                listDiv.className = 'grid grid-cols-1 gap-1';

                for (const [key, chord] of Object.entries(chords)) {
                    const label = document.createElement('label');
                    label.className = 'flex items-center gap-2 cursor-pointer text-slate-300 hover:text-white select-none text-xs';
                    label.innerHTML = `
                        <input type="checkbox" value="${key}" checked class="chord-checkbox custom-cb shrink-0">
                        <span class="truncate font-medium">${chord.rawShort} — ${chord.name}</span>
                    `;
                    listDiv.appendChild(label);
                }
                groupDiv.appendChild(listDiv);
                chordTypesContainer.appendChild(groupDiv);
            }
            updateActiveBadge();
        }

        selectAllBtn.onclick = () => {
            document.querySelectorAll('.chord-checkbox').forEach(cb => cb.checked = true);
            updateActiveBadge();
            renderAnswerButtons();
            prepareNewQuestion();
        };

        deselectAllBtn.onclick = () => {
            document.querySelectorAll('.chord-checkbox').forEach(cb => cb.checked = false);
            updateActiveBadge();
            renderAnswerButtons();
        };

        function getActiveChordTypes() {
            const active = [];
            document.querySelectorAll('.chord-checkbox').forEach(cb => {
                if (cb.checked) {
                    active.push(cb.value);
                }
            });
            return active;
        }

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function stopActiveNotes() {
            const ctx = getAudioContext();
            activeNodes.forEach(node => {
                try {
                    node.gain.gain.cancelScheduledValues(ctx.currentTime);
                    node.gain.gain.setValueAtTime(node.gain.gain.value, ctx.currentTime);
                    node.gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.02);
                    node.osc.stop(ctx.currentTime + 0.03);
                } catch(e) {}
            });
            activeNodes = [];
        }

        function midiToFreq(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function playTone(freq, startTime, duration) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const masterVol = parseInt(volumeSlider.value) / 100;

            osc.type = 'sine';
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.18 * masterVol, startTime + 0.05);
            gain.gain.setValueAtTime(0.18 * masterVol, startTime + duration - 0.25);
            gain.gain.linearRampToValueAtTime(0.001, startTime + duration);

            osc.frequency.setValueAtTime(freq, startTime);
            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);

            const nodeObj = { osc, gain };
            activeNodes.push(nodeObj);
            setTimeout(() => {
                const idx = activeNodes.indexOf(nodeObj);
                if (idx !== -1) activeNodes.splice(idx, 1);
            }, (startTime - ctx.currentTime + duration) * 1000);
        }

        function playCurrentChord() {
            if (!currentChord) {
                prepareNewQuestion();
            }
            stopActiveNotes(); 
            
            const ctx = getAudioContext();
            const now = ctx.currentTime + 0.05;
            const voicing = voicingSelect.value;
            const tempoSetting = tempoSelect.value;

            const stepTime = tempoSetting === 'very_slow' ? 0.6 : (tempoSetting === 'slow' ? 0.4 : (tempoSetting === 'fast' ? 0.15 : 0.25));
            const rootNoteName = currentRoot;
            const rootMidi = 60 + NOTE_OFFSETS[rootNoteName];
            const intervals = ALL_CHORDS[currentChord].intervals;

            if (voicing === 'harmonic') {
                intervals.forEach(interval => {
                    const freq = midiToFreq(rootMidi + interval);
                    playTone(freq, now, 2.5);
                });
            } else if (voicing === 'melodic') {
                intervals.forEach((interval, idx) => {
                    const freq = midiToFreq(rootMidi + interval);
                    const noteStart = now + idx * stepTime;
                    playTone(freq, noteStart, stepTime * 0.9);
                });
            } else if (voicing === 'melodic_layered') {
                const totalDuration = (intervals.length - 1) * stepTime + 3.2;
                intervals.forEach((interval, idx) => {
                    const freq = midiToFreq(rootMidi + interval);
                    const noteStart = now + idx * stepTime;
                    const duration = totalDuration - (idx * stepTime);
                    playTone(freq, noteStart, duration);
                });
            }
        }

        function prepareNewQuestion() {
            const activeTypes = getActiveChordTypes();
            if (activeTypes.length === 0) {
                document.querySelectorAll('.chord-checkbox').forEach(cb => cb.checked = true);
                updateActiveBadge();
            }
            const currentActiveTypes = getActiveChordTypes();
            currentChord = currentActiveTypes[Math.floor(Math.random() * currentActiveTypes.length)];

            const selectedRootSetting = rootSelect.value;
            if (selectedRootSetting === 'random') {
                currentRoot = NOTE_NAMES[Math.floor(Math.random() * NOTE_NAMES.length)];
            } else {
                currentRoot = selectedRootSetting;
            }

            canAnswer = true;
            feedbackBox.classList.add('hidden');
            renderAnswerButtons();
        }

        function renderAnswerButtons() {
            const answersContainer = document.getElementById('answersContainer');
            answersContainer.innerHTML = '';
            const activeTypes = getActiveChordTypes();

            for (const [catName, chords] of Object.entries(CHORD_CATEGORIES)) {
                const activeCatChords = Object.keys(chords).filter(key => activeTypes.includes(key));
                if (activeCatChords.length === 0) continue;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'bg-slate-900/40 p-1.5 rounded-lg border border-slate-700/50 space-y-1';

                const titleEl = document.createElement('div');
                titleEl.className = 'text-[9px] font-semibold text-indigo-400 uppercase tracking-wider';
                titleEl.textContent = catName;
                groupDiv.appendChild(titleEl);

                const gridDiv = document.createElement('div');
                gridDiv.className = 'grid grid-cols-4 sm:grid-cols-7 gap-1.5';

                activeCatChords.forEach(typeKey => {
                    const chordInfo = ALL_CHORDS[typeKey];
                    const btn = document.createElement('button');
                    btn.className = 'py-1 px-1.5 bg-slate-700/80 hover:bg-slate-600 active:bg-slate-500 rounded text-xs font-medium text-slate-200 transition text-center border border-slate-600/50 flex flex-col items-center justify-center shadow-sm';
                    btn.dataset.chordKey = typeKey;
                    btn.innerHTML = `<span class="font-bold text-indigo-300 text-xs sm:text-sm">${chordInfo.short}</span>`;
                    btn.onclick = () => handleAnswer(typeKey, btn);
                    gridDiv.appendChild(btn);
                });

                groupDiv.appendChild(gridDiv);
                answersContainer.appendChild(groupDiv);
            }
        }

        function handleAnswer(selectedKey, buttonElement) {
            if (!canAnswer) return;
            canAnswer = false;

            stats.total++;
            chordStats[currentChord].total++;
            const isCorrect = selectedKey === currentChord;

            if (isCorrect) {
                stats.correct++;
                chordStats[currentChord].correct++;
            }

            history.unshift({
                chordName: ALL_CHORDS[currentChord].rawShort,
                root: currentRoot,
                isCorrect: isCorrect
            });
            if (history.length > 8) history.pop();

            const allButtons = document.querySelectorAll('#answersContainer button');
            allButtons.forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.chordKey === currentChord) {
                    btn.classList.add('bg-emerald-600/30', 'border-emerald-500', 'text-emerald-200');
                }
            });

            if (isCorrect) {
                buttonElement.classList.remove('bg-slate-700/80', 'hover:bg-slate-600');
                buttonElement.classList.add('bg-emerald-600', 'border-emerald-400', 'text-white');
                showFeedback(`✓ Верно! Это ${ALL_CHORDS[currentChord].rawShort} (${currentRoot}).`, 'success');
            } else {
                buttonElement.classList.remove('bg-slate-700/80', 'hover:bg-slate-600');
                buttonElement.classList.add('bg-rose-600/80', 'border-rose-400', 'text-white');
                showFeedback(`✗ Ошибка. Это ${ALL_CHORDS[currentChord].rawShort} (${currentRoot}).`, 'error');
            }

            updateStatsDisplay();
            updateHistoryDisplay();
            updateDetailedStatsDisplay();

            if (isCorrect) {
                setTimeout(() => {
                    prepareNewQuestion();
                    playCurrentChord();
                }, 1000);
            } else {
                setTimeout(() => {
                    playCurrentChord();
                }, 400);

                setTimeout(() => {
                    prepareNewQuestion();
                    playCurrentChord();
                }, 3000);
            }
        }

        function showFeedback(text, type) {
            feedbackBox.textContent = text;
            feedbackBox.classList.remove('hidden', 'bg-emerald-950/80', 'text-emerald-200', 'border-emerald-700', 'bg-rose-950/80', 'text-rose-200', 'border-rose-700');
            
            if (type === 'success') {
                feedbackBox.classList.add('bg-emerald-950/80', 'text-emerald-200', 'border', 'border-emerald-700');
            } else {
                feedbackBox.classList.add('bg-rose-950/80', 'text-rose-200', 'border', 'border-rose-700');
            }
        }

        function updateStatsDisplay() {
            correctCountEl.textContent = stats.correct;
            totalCountEl.textContent = stats.total;
            const accuracy = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
            accuracyCountEl.textContent = accuracy + '%';
        }

        function updateHistoryDisplay() {
            if (history.length === 0) {
                historyContainer.innerHTML = '<span class="text-[10px] text-slate-500 italic">Нет ответов...</span>';
                return;
            }
            historyContainer.innerHTML = '';
            history.forEach(item => {
                const badge = document.createElement('div');
                badge.className = `px-1.5 py-0.5 rounded text-[10px] font-medium whitespace-nowrap border flex items-center gap-0.5 ${
                    item.isCorrect 
                        ? 'bg-emerald-950/60 border-emerald-700/60 text-emerald-300' 
                        : 'bg-rose-950/60 border-rose-700/60 text-rose-300'
                }`;
                badge.innerHTML = `<span>${item.isCorrect ? '✓' : '✗'}</span> <span>${item.root} ${item.chordName}</span>`;
                historyContainer.appendChild(badge);
            });
        }

        function updateDetailedStatsDisplay() {
            detailedStatsList.innerHTML = '';
            for (const [key, st] of Object.entries(chordStats)) {
                if (st.total === 0) continue;
                const acc = Math.round((st.correct / st.total) * 100);
                const item = document.createElement('div');
                item.className = 'bg-slate-900 p-1.5 rounded border border-slate-700 flex justify-between items-center text-xs';
                item.innerHTML = `
                    <span class="text-slate-300 truncate pr-2 font-medium">${ALL_CHORDS[key].rawShort} (${ALL_CHORDS[key].name})</span>
                    <span class="font-bold text-indigo-300 whitespace-nowrap">${st.correct}/${st.total} (${acc}%)</span>
                `;
                detailedStatsList.appendChild(item);
            }
        }

        playBtn.onclick = () => {
            prepareNewQuestion();
            playCurrentChord();
        };

        repeatBtn.onclick = () => {
            playCurrentChord();
        };

        resetStatsBtn.onclick = () => {
            stats.correct = 0;
            stats.total = 0;
            history = [];
            for (const key in chordStats) {
                chordStats[key] = { correct: 0, total: 0 };
            }
            updateStatsDisplay();
            updateHistoryDisplay();
            updateDetailedStatsDisplay();
            prepareNewQuestion();
        };

        window.onload = () => {
            initChordCheckboxes();
            updateStatsDisplay();
            renderAnswerButtons();
            prepareNewQuestion();
        };
    </script>
</body>
</html>

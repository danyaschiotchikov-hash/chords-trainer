<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренажер аккордов на слух</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080c17;
            color: #f1f5f9;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }

        .custom-cb {
            appearance: none; -webkit-appearance: none; width: 14px; height: 14px;
            border: 1px solid #475569; border-radius: 4px; background-color: #1e293b;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease; outline: none; flex-shrink: 0;
        }
        .custom-cb:checked { background-color: #6366f1; border-color: #6366f1; }
        .custom-cb:checked::after { content: "✓"; font-size: 10px; color: white; font-weight: bold; line-height: 1; }
        
        select {
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 6px center; background-size: 10px;
            padding-right: 20px !important;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        
        .ans-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            transition: all 0.15s ease-out;
        }
        .ans-btn:active { transform: scale(0.96); }
        .ans-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .ans-btn.correct { 
            background: rgba(16, 185, 129, 0.25) !important; 
            border-color: #10b981 !important; 
            color: #34d399 !important; 
            box-shadow: inset 0 0 12px rgba(16,185,129,0.2); 
        }
        .ans-btn.wrong { 
            background: rgba(225, 29, 72, 0.25) !important; 
            border-color: #e11d48 !important; 
            color: #fb7185 !important; 
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col p-1.5 sm:p-2 max-w-4xl mx-auto overflow-hidden text-xs">

    <header class="glass-panel rounded-xl py-2 px-2.5 flex flex-col gap-2 z-10 shrink-0 shadow-md">
        <div class="flex flex-wrap justify-between items-center gap-2 w-full">
            <div class="flex items-center gap-2 flex-wrap">
                <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-700/50 px-2 py-1 rounded-lg transition-colors border border-indigo-500/30 bg-indigo-950/20 shadow-sm" title="Самоконтроль без выбора кнопок">
                    <input type="checkbox" id="verbalModeCb" class="custom-cb border-indigo-400/50">
                    <span class="text-[11px] font-bold text-indigo-300">Устный режим</span>
                </label>
                <div class="h-3 w-px bg-slate-600"></div>
                <select id="tempoSelect" class="bg-slate-900 border border-slate-700 rounded-md px-1.5 py-1 text-[11px] font-medium text-slate-200 focus:outline-none focus:border-indigo-500 shadow-sm">
                    <option value="very_slow">Очень медл.</option>
                    <option value="slow" selected>Медленно</option>
                    <option value="normal">Умеренно</option>
                    <option value="fast">Быстро</option>
                </select>
                <select id="playbackStyleSelect" class="bg-slate-900 border border-slate-700 rounded-md px-1.5 py-1 text-[11px] font-medium text-slate-200 focus:outline-none focus:border-indigo-500 shadow-sm">
                    <option value="arpeggio" selected>Арпеджио</option>
                    <option value="harmonic">Гармонически</option>
                </select>
                <select id="directionSelect" class="bg-slate-900 border border-slate-700 rounded-md px-1.5 py-1 text-[11px] font-medium text-slate-200 focus:outline-none focus:border-indigo-500 shadow-sm">
                    <option value="up" selected>Снизу вверх</option>
                    <option value="down">Сверху вниз</option>
                    <option value="random">Вразброс</option>
                </select>
                <select id="timbreSelect" class="bg-slate-900 border border-slate-700 rounded-md px-1.5 py-1 text-[11px] font-medium text-slate-200 focus:outline-none focus:border-indigo-500 shadow-sm">
                    <option value="epiano">Электропиано</option>
                    <option value="piano" selected>Пианино</option>
                    <option value="organ">Орган</option>
                    <option value="strings">Струнные</option>
                    <option value="basic">Синтезатор</option>
                </select>
                <select id="rootSelect" class="bg-slate-900 border border-slate-700 rounded-md px-1.5 py-1 text-[11px] font-medium text-slate-200 focus:outline-none focus:border-indigo-500 shadow-sm">
                    <option value="random">Любой тон</option>
                    <option value="C">C</option><option value="D">D</option><option value="E">E</option>
                    <option value="F">F</option><option value="G">G</option><option value="A">A</option><option value="B">B</option>
                </select>
                <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 rounded-md px-1.5 py-1 shadow-sm" title="Громкость">
                    <span class="text-[11px] select-none">🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" class="w-16 sm:w-20 accent-indigo-500 cursor-pointer">
                </div>
            </div>

            <div class="flex items-center gap-1.5">
                <button id="btnSettings" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-lg text-[11px] font-bold border border-slate-600 transition-colors flex items-center gap-1.5 shadow-sm">
                    ⚙️ Настройки <span id="activeCount" class="bg-indigo-600 text-white px-1.5 py-0.5 rounded-md text-[10px] shadow-inner">0</span>
                </button>
                <button id="btnStats" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-emerald-300 rounded-lg text-[11px] font-bold border border-slate-600 transition-colors shadow-sm" title="Статистика">
                    📊
                </button>
            </div>
        </div>

        <div id="quickCategoryToggles" class="flex flex-wrap items-center justify-start gap-x-3 gap-y-1.5 pt-1 border-t border-slate-700/50 w-full">
            <!-- Populated by JS -->
        </div>
    </header>

    <main class="flex-grow flex flex-col mt-1.5 gap-1.5 relative min-h-0">
        
        <div id="actionControls" class="flex gap-2 shrink-0">
            <button id="btnNew" class="flex-1 py-2.5 bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-400 hover:to-indigo-500 text-white font-bold rounded-xl text-[13px] shadow-md border border-indigo-400/50 active:scale-[0.98] transition-all flex justify-center items-center gap-1.5">
                ▶️ Новый
            </button>
            <button id="btnRepeat" class="flex-1 py-2.5 bg-slate-800/80 hover:bg-slate-700 text-indigo-200 font-bold rounded-xl text-[13px] shadow-sm border border-slate-600/80 active:scale-[0.98] transition-all flex justify-center items-center gap-1.5">
                🔁 Повтор
            </button>
        </div>

        <div id="statusBar" class="w-full py-2 px-3 rounded-xl text-xs font-semibold text-center glass-panel text-indigo-300 shrink-0 shadow-inner flex flex-col items-center justify-center transition-colors min-h-[36px]">
            🎵 Нажмите «Новый» (На iPhone отключите беззвучный режим!)
        </div>

        <div id="answersWrapper" class="flex-grow glass-panel rounded-xl p-2 overflow-y-auto flex flex-col gap-2 min-h-0 custom-scrollbar">
            <!-- Populated by JS -->
        </div>

        <div id="verbalWrapper" class="flex-grow glass-panel rounded-xl p-4 hidden flex-col items-center justify-center gap-5 min-h-0">
            <div id="verbalDisplay" class="w-full max-w-md h-24 bg-slate-900 border border-slate-700 rounded-2xl flex flex-col items-center justify-center shadow-inner text-slate-500 font-bold text-lg px-4 text-center transition-all">
                ???
            </div>
            <button id="btnShowAnswer" class="px-6 py-3 glass-panel hover:bg-slate-700 text-indigo-300 font-bold rounded-xl border border-slate-500 active:scale-95 transition-all shadow-md text-sm">
                👀 Показать ответ
            </button>
            <div class="flex gap-3 w-full max-w-md mt-2">
                <button id="btnVerbalRepeat" class="flex-1 py-3.5 glass-panel hover:bg-slate-700 text-indigo-200 font-bold rounded-xl text-sm shadow-sm active:scale-[0.98] transition-all flex flex-col items-center gap-1">
                    <span class="text-xl">🔁</span> Повтор
                </button>
                <button id="btnVerbalNew" class="flex-1 py-3.5 bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-400 hover:to-indigo-500 text-white font-bold rounded-xl text-sm shadow-md border border-indigo-400/50 active:scale-[0.98] transition-all flex flex-col items-center gap-1">
                    <span class="text-xl">▶️</span> Новый
                </button>
            </div>
        </div>
    </main>

    <div id="settingsModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex-col items-center justify-center p-2">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-3xl max-h-[96vh] flex flex-col shadow-2xl">
            <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-800/40 rounded-t-2xl shrink-0">
                <h2 class="text-xs font-extrabold text-indigo-300 uppercase tracking-widest">Настройка элементов</h2>
                <button id="btnCloseSettings" class="text-slate-300 hover:text-white px-4 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-[11px] font-bold border border-slate-500 transition-colors shadow-sm">Готово</button>
            </div>
            <div id="settingsContent" class="p-2 overflow-y-auto flex-grow space-y-2 custom-scrollbar">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <div id="statsModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex-col items-center justify-center p-2">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-800/40 rounded-t-2xl shrink-0">
                <h2 class="text-xs font-extrabold text-emerald-400 uppercase tracking-widest">Статистика</h2>
                <div class="flex gap-2">
                    <button id="btnResetStats" class="text-rose-400 hover:text-rose-300 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-[11px] font-bold border border-slate-600 transition-colors shadow-sm">Сброс</button>
                    <button id="btnCloseStats" class="text-slate-300 hover:text-white px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-[11px] font-bold border border-slate-500 transition-colors shadow-sm">Закрыть</button>
                </div>
            </div>
            <div class="p-3 overflow-y-auto flex-grow custom-scrollbar">
                <div id="overallAccuracy" class="text-center text-sm font-bold text-white mb-3 bg-slate-800 py-2.5 rounded-xl border border-slate-700 shadow-inner">
                    Точность: 0%
                </div>
                <div id="detailedStats" class="space-y-0.5"></div>
            </div>
        </div>
    </div>

    <script>
        const ALL_ITEMS = {
            // Простые интервалы
            'm2': { cat: 'simple', name: 'Малая секунда', short: 'м.2', int: [0, 1] },
            'M2': { cat: 'simple', name: 'Большая секунда', short: 'б.2', int: [0, 2] },
            'm3': { cat: 'simple', name: 'Малая терция', short: 'м.3', int: [0, 3] },
            'M3': { cat: 'simple', name: 'Большая терция', short: 'б.3', int: [0, 4] },
            'P4': { cat: 'simple', name: 'Чистая кварта', short: 'ч.4', int: [0, 5] },
            'P5': { cat: 'simple', name: 'Чистая квинта', short: 'ч.5', int: [0, 7] },
            'm6': { cat: 'simple', name: 'Малая секста', short: 'м.6', int: [0, 8] },
            'M6': { cat: 'simple', name: 'Большая секста', short: 'б.6', int: [0, 9] },
            'm7': { cat: 'simple', name: 'Малая септима', short: 'м.7', int: [0, 10] },
            'M7': { cat: 'simple', name: 'Большая септима', short: 'б.7', int: [0, 11] },

            // Характерные интервалы (без подсказок в названии)
            'aug2':   { cat: 'char', name: 'Увеличенная секунда', short: 'ув.2', int: [0, 3], res: [-1, 4] },
            'dim7':   { cat: 'char', name: 'Уменьшенная септима', short: 'ум.7', int: [0, 9], res: [1, 8] },
            
            'dim4':   { cat: 'char', name: 'Уменьшенная кварта', short: 'ум.4', int: [0, 4], res: [1, 4] },
            'aug5':   { cat: 'char', name: 'Увеличенная квинта', short: 'ув.5', int: [0, 8], res: [-1, 8] },
            
            'aug4_n': { cat: 'char', name: 'Тритон (ув.4 нат.)', short: 'ув.4 (н)', int: [0, 6], res: [-1, 7] },
            'dim5_n': { cat: 'char', name: 'Тритон (ум.5 нат.)', short: 'ум.5 (н)', int: [0, 6], res: [1, 5] },
            
            'aug4_h': { cat: 'char', name: 'Тритон (ув.4 гарм.)', short: 'ув.4 (г)', int: [0, 6], res: [-2, 7] },
            'dim5_h': { cat: 'char', name: 'Тритон (ум.5 гарм.)', short: 'ум.5 (г)', int: [0, 6], res: [1, 4] },

            // Трезвучия (Мажорные, Минорные, Остальные)
            'triad_maj':   { cat: 'triad', name: 'Мажорное (Б5/3)', short: 'Б5/3', int: [0, 4, 7], triadGroup: 'maj' },
            'triad_maj6':  { cat: 'triad', name: 'Мажорный секстаккорд', short: 'Б6', int: [0, 3, 8], triadGroup: 'maj' },
            'triad_maj64': { cat: 'triad', name: 'Маж. квартсекстаккорд', short: 'Б6/4', int: [0, 5, 9], triadGroup: 'maj' },
            
            'triad_min':   { cat: 'triad', name: 'Минорное (М5/3)', short: 'М5/3', int: [0, 3, 7], triadGroup: 'min' },
            'triad_min6':  { cat: 'triad', name: 'Минорный секстаккорд', short: 'М6', int: [0, 4, 9], triadGroup: 'min' },
            'triad_min64': { cat: 'triad', name: 'Мин. квартсекстаккорд', short: 'М6/4', int: [0, 5, 8], triadGroup: 'min' },
            
            'triad_aug':   { cat: 'triad', name: 'Увеличенное', short: 'Ув5/3', int: [0, 4, 8], triadGroup: 'other' },
            'triad_dim':   { cat: 'triad', name: 'Уменьшенное', short: 'Ум5/3', int: [0, 3, 6], triadGroup: 'other' },

            // Септаккорды (в академическом формате)
            '7_bb':  { cat: 'seventh', name: 'Большой мажорный', short: 'ББ7', int: [0, 4, 7, 11] },
            '7_mb':  { cat: 'seventh', name: 'Доминантсептаккорд', short: 'МБ7', int: [0, 4, 7, 10] },
            '7_bm':  { cat: 'seventh', name: 'Большой минорный', short: 'БМ7', int: [0, 3, 7, 11] },
            '7_mm':  { cat: 'seventh', name: 'Малый минорный', short: 'ММ7', int: [0, 3, 7, 10] },
            '7_m5':  { cat: 'seventh', name: 'Полуменьшенный', short: 'МУм7', int: [0, 3, 6, 10] },
            '7_dim': { cat: 'seventh', name: 'Уменьшенный', short: 'УмУм7', int: [0, 3, 6, 9] },

            // Обращения D7
            'd7_65': { cat: 'd7inv', name: 'Квинтсекстаккорд', short: 'D6/5', int: [0, 3, 6, 8], hint: 'на VII' },
            'd7_43': { cat: 'd7inv', name: 'Терцквартаккорд', short: 'D4/3', int: [0, 3, 5, 9], hint: 'на II' },
            'd7_2':  { cat: 'd7inv', name: 'Секундаккорд', short: 'D2', int: [0, 2, 6, 9], hint: 'на IV' },

            // Базовые Гаммы (Мажорные, Минорные, Дважды гармонические)
            'sc_maj':  { cat: 'scale_basic', name: 'Натуральный мажор', short: 'Нат. Мажор', int: [0,2,4,5,7,9,11,12], scaleGroup: 'maj' },
            'sc_hmaj': { cat: 'scale_basic', name: 'Гармонический мажор', short: 'Гарм. Маж.', int: [0,2,4,5,7,8,11,12], hint: 'VI♭', scaleGroup: 'maj' },
            'sc_mmaj': { cat: 'scale_basic', name: 'Мелодический мажор', short: 'Мел. Маж.', int: [0,2,4,5,7,8,10,12], hint: 'VI♭, VII♭', scaleGroup: 'maj' },
            
            'sc_min':  { cat: 'scale_basic', name: 'Натуральный минор', short: 'Нат. Минор', int: [0,2,3,5,7,8,10,12], scaleGroup: 'min' },
            'sc_hmin': { cat: 'scale_basic', name: 'Гармонический минор', short: 'Гарм. Мин.', int: [0,2,3,5,7,8,11,12], hint: 'VII♯', scaleGroup: 'min' },
            'sc_mmin': { cat: 'scale_basic', name: 'Мелодический минор', short: 'Мел. Мин.', int: [0,2,3,5,7,9,11,12], hint: 'VI♯, VII♯', scaleGroup: 'min' },
            
            'sc_2hmaj':{ cat: 'scale_basic', name: 'Дважды гарм. мажор', short: 'Дв.гарм.Маж', int: [0,1,4,5,7,8,11,12], hint: 'II♭, VI♭', scaleGroup: 'other' },
            'sc_2hmin':{ cat: 'scale_basic', name: 'Дважды гарм. минор', short: 'Дв.гарм.Мин', int: [0,2,3,6,7,8,11,12], hint: 'IV♯, VII♯', scaleGroup: 'other' },

            // Народные лады и Пентатоника
            'sc_dor':  { cat: 'scale_modes', name: 'Дорийский', short: 'Дорийский', int: [0,2,3,5,7,9,10,12], hint: 'VI♯' },
            'sc_phr':  { cat: 'scale_modes', name: 'Фригийский', short: 'Фригийский', int: [0,1,3,5,7,8,10,12], hint: 'II♭' },
            'sc_lyd':  { cat: 'scale_modes', name: 'Лидийский', short: 'Лидийский', int: [0,2,4,6,7,9,11,12], hint: 'IV♯' },
            'sc_mix':  { cat: 'scale_modes', name: 'Миксолидийский', short: 'Миксол.', int: [0,2,4,5,7,9,10,12], hint: 'VII♭' },
            'sc_loc':  { cat: 'scale_modes', name: 'Локрийский', short: 'Локрийский', int: [0,1,3,5,6,8,10,12], hint: 'II♭, V♭' },
            'sc_pmaj': { cat: 'scale_modes', name: 'Пентатоника Мажор', short: 'Пент. Мажор', int: [0,2,4,7,9,12], hint: 'без IV, VII' },
            'sc_pmin': { cat: 'scale_modes', name: 'Пентатоника Минор', short: 'Пент. Минор', int: [0,3,5,7,10,12], hint: 'без II, VI' }
        };

        for (const k in ALL_ITEMS) { ALL_ITEMS[k].key = k; }

        const CATS = {
            simple: Object.values(ALL_ITEMS).filter(i => i.cat === 'simple'),
            char: Object.values(ALL_ITEMS).filter(i => i.cat === 'char'),
            triad: Object.values(ALL_ITEMS).filter(i => i.cat === 'triad'),
            seventh: Object.values(ALL_ITEMS).filter(i => i.cat === 'seventh'),
            d7inv: Object.values(ALL_ITEMS).filter(i => i.cat === 'd7inv'),
            scale_basic: Object.values(ALL_ITEMS).filter(i => i.cat === 'scale_basic'),
            scale_modes: Object.values(ALL_ITEMS).filter(i => i.cat === 'scale_modes')
        };

        const CATEGORIES_INFO = [
            { id: 'simple', label: 'Простые' },
            { id: 'char', label: 'Характерные' },
            { id: 'triad', label: 'Трезвучия' },
            { id: 'seventh', label: 'Септаккорды' },
            { id: 'd7inv', label: 'Обр. D7' },
            { id: 'scale_basic', label: 'Гаммы' },
            { id: 'scale_modes', label: 'Лады' }
        ];

        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        let activeKeys = Object.keys(ALL_ITEMS); 
        let currentItemKey = null;
        let currentBaseNote = 60;
        let currentBaseName = 'C';
        let isVerbalMode = false;
        let stats = {}; 

        const DOM = {
            get verbalCb() { return document.getElementById('verbalModeCb'); },
            get tempo() { return document.getElementById('tempoSelect'); },
            get playback() { return document.getElementById('playbackStyleSelect'); },
            get direction() { return document.getElementById('directionSelect'); },
            get timbre() { return document.getElementById('timbreSelect'); },
            get root() { return document.getElementById('rootSelect'); },
            get volumeSlider() { return document.getElementById('volumeSlider'); },
            get activeCount() { return document.getElementById('activeCount'); },
            get btnSettings() { return document.getElementById('btnSettings'); },
            get btnStats() { return document.getElementById('btnStats'); },
            get btnNew() { return document.getElementById('btnNew'); },
            get btnRepeat() { return document.getElementById('btnRepeat'); },
            get btnVerbalNew() { return document.getElementById('btnVerbalNew'); },
            get btnVerbalRepeat() { return document.getElementById('btnVerbalRepeat'); },
            get statusBar() { return document.getElementById('statusBar'); },
            get answersWrap() { return document.getElementById('answersWrapper'); },
            get verbalWrap() { return document.getElementById('verbalWrapper'); },
            get verbalDisplay() { return document.getElementById('verbalDisplay'); },
            get btnShowAnswer() { return document.getElementById('btnShowAnswer'); },
            get settingsModal() { return document.getElementById('settingsModal'); },
            get settingsContent() { return document.getElementById('settingsContent'); },
            get btnCloseSettings() { return document.getElementById('btnCloseSettings'); },
            get statsModal() { return document.getElementById('statsModal'); },
            get btnCloseStats() { return document.getElementById('btnCloseStats'); },
            get btnResetStats() { return document.getElementById('btnResetStats'); },
            get detailedStats() { return document.getElementById('detailedStats'); },
            get overallAccuracy() { return document.getElementById('overallAccuracy'); }
        };

        const DB_NAME = 'ChordTrainerDB';
        const STORE_NAME = 'trainerData';
        async function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 6);
                req.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e.target.error);
            });
        }
        async function getSavedData(key) {
            try {
                const db = await openDB();
                return new Promise(resolve => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch (e) { return null; }
        }
        async function setSavedData(key, value) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(value, key);
            } catch (e) {}
        }

        let audioCtx = null;
        let activeNodes = [];

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function unlockAudio() {
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') ctx.resume();
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            gain.gain.value = 0; 
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (osc.start) osc.start(ctx.currentTime);
            if (osc.stop) osc.stop(ctx.currentTime + 0.01);
            
            ['touchstart', 'touchend', 'click'].forEach(evt => {
                document.body.removeEventListener(evt, unlockAudio);
            });
        }

        function stopAudio() {
            activeNodes.forEach(n => {
                try { 
                    n.gain.gain.cancelScheduledValues(audioCtx.currentTime);
                    n.gain.gain.setValueAtTime(n.gain.gain.value, audioCtx.currentTime);
                    n.gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.03);
                    if (n.oscs) {
                        n.oscs.forEach(osc => {
                            try { osc.stop(audioCtx.currentTime + 0.04); } catch(e){}
                        });
                    }
                } catch (e) {}
            });
            activeNodes = [];
        }

        function playFrequencies(freqs, durationMs, type = 'arpeggio', isScale = false, onComplete = null, speedMultiplier = 1.0, notesMeta = null) {
            stopAudio();
            const ctx = getAudioContext();
            
            const tempoMultiplier = (DOM.tempo.value === 'very_slow' ? 1.5 : 
                                    DOM.tempo.value === 'slow' ? 1.2 : 
                                    DOM.tempo.value === 'fast' ? 0.6 : 1.0) * speedMultiplier;
            const timbre = DOM.timbre ? DOM.timbre.value : 'piano';
            const userVol = DOM.volumeSlider ? parseFloat(DOM.volumeSlider.value) : 0.5;
            
            const delaySec = Math.max(0.04, (durationMs / 1000) * tempoMultiplier);
            // Уменьшено общее затухание звука для аккордов
            const sustainDuration = isScale ? 0.0 : 1.0; 
            const fadeOutDuration = isScale ? 0.05 : 0.4; 
            
            let maxStopTime = ctx.currentTime + 0.1;

            freqs.forEach((freq, i) => {
                let startTime, stopTime, fadeOutStart;
                
                const meta = notesMeta ? notesMeta[i] : { heightIndex: i, functionalInterval: 0 };
                const balanceFactor = Math.max(0.5, 1.0 - (meta.heightIndex * 0.09));

                let volBoost = 1.0;
                let brightBoost = 1.0;
                
                if (meta.functionalInterval === 4) { // Б.3
                    volBoost = 1.35; brightBoost = 1.45;
                } else if (meta.functionalInterval === 3) { // М.3
                    volBoost = 1.20; brightBoost = 1.20;
                } else if (meta.functionalInterval === 5) { // Ч.4
                    volBoost = 1.25; brightBoost = 1.30;
                }

                if (isScale) {
                    startTime = ctx.currentTime + i * delaySec; 
                    stopTime = startTime + delaySec * 0.95; // Без наслоения звуков (убрано затухание)
                    fadeOutStart = stopTime - 0.02;
                } else if (type === 'arpeggio') {
                    startTime = ctx.currentTime + i * delaySec;
                    const lastNoteStart = ctx.currentTime + (freqs.length - 1) * delaySec;
                    fadeOutStart = lastNoteStart + sustainDuration;
                    stopTime = fadeOutStart + fadeOutDuration;
                } else {
                    startTime = ctx.currentTime;
                    fadeOutStart = ctx.currentTime + sustainDuration;
                    stopTime = fadeOutStart + fadeOutDuration;
                }
                
                if (stopTime > maxStopTime) maxStopTime = stopTime;

                const masterGain = ctx.createGain();
                const maxVol = Math.max(0.001, (userVol * 0.15 * balanceFactor * volBoost) / Math.max(1, freqs.length * 0.35)); 
                
                if (isScale) {
                    masterGain.gain.setValueAtTime(0.001, startTime);
                    masterGain.gain.linearRampToValueAtTime(maxVol, startTime + 0.015);
                    masterGain.gain.setValueAtTime(maxVol, fadeOutStart);
                    masterGain.gain.linearRampToValueAtTime(0.001, stopTime);
                } else if (type === 'arpeggio') {
                    masterGain.gain.setValueAtTime(0.001, startTime);
                    masterGain.gain.linearRampToValueAtTime(maxVol, startTime + 0.025);
                    masterGain.gain.setValueAtTime(maxVol, fadeOutStart);
                    masterGain.gain.exponentialRampToValueAtTime(Math.max(0.001, maxVol * 0.1), stopTime);
                } else {
                    masterGain.gain.setValueAtTime(0.001, startTime);
                    masterGain.gain.linearRampToValueAtTime(maxVol, startTime + 0.025);
                    masterGain.gain.exponentialRampToValueAtTime(Math.max(0.001, maxVol * 0.3), fadeOutStart);
                    masterGain.gain.exponentialRampToValueAtTime(0.001, stopTime);
                }
                
                masterGain.connect(ctx.destination);
                let nodesToStop = [];
                
                if (timbre === 'epiano') {
                    const carrier = ctx.createOscillator(); carrier.type = 'sine'; carrier.frequency.value = freq;
                    const modulator = ctx.createOscillator(); modulator.type = 'sine'; modulator.frequency.value = freq * 2.0; 
                    const modGain = ctx.createGain();
                    modulator.connect(modGain); modGain.connect(carrier.frequency); carrier.connect(masterGain);
                    const maxModIndex = freq * 0.6 * brightBoost; 
                    modGain.gain.setValueAtTime(0, startTime);
                    modGain.gain.linearRampToValueAtTime(maxModIndex, startTime + 0.015); 
                    modGain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.2); 
                    carrier.start(startTime); modulator.start(startTime);
                    nodesToStop.push(carrier, modulator);
                } else if (timbre === 'piano') {
                    const osc1 = ctx.createOscillator(); osc1.type = 'triangle'; osc1.frequency.value = freq;
                    const osc2 = ctx.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = freq * 2;
                    const osc3 = ctx.createOscillator(); osc3.type = 'sine'; osc3.frequency.value = freq * 3;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.Q.value = 0.2;
                    filter.frequency.setValueAtTime(600 * brightBoost, startTime); 
                    if (isScale) {
                        filter.frequency.linearRampToValueAtTime(400, stopTime); // Гаммы не "глохнут" слишком рано
                    } else {
                        filter.frequency.exponentialRampToValueAtTime(200, startTime + 0.4);
                    }
                    
                    const g1 = ctx.createGain(); g1.gain.value = 1.0;
                    const g2 = ctx.createGain(); g2.gain.value = 0.12; 
                    const g3 = ctx.createGain(); g3.gain.value = 0.03;

                    osc1.connect(g1); osc2.connect(g2); osc3.connect(g3);
                    g1.connect(filter); g2.connect(filter); g3.connect(filter);
                    filter.connect(masterGain);

                    osc1.start(startTime); osc2.start(startTime); osc3.start(startTime);
                    nodesToStop.push(osc1, osc2, osc3);
                } else if (timbre === 'organ') {
                    const osc1 = ctx.createOscillator(); osc1.type = 'sine'; osc1.frequency.value = freq;
                    const osc2 = ctx.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = freq * 2;
                    const osc3 = ctx.createOscillator(); osc3.type = 'sine'; osc3.frequency.value = freq * 3;
                    const g1 = ctx.createGain(); g1.gain.value = 0.7;
                    const g2 = ctx.createGain(); g2.gain.value = 0.2 * brightBoost;
                    const g3 = ctx.createGain(); g3.gain.value = 0.1 * brightBoost;
                    osc1.connect(g1); osc2.connect(g2); osc3.connect(g3);
                    g1.connect(masterGain); g2.connect(masterGain); g3.connect(masterGain);
                    osc1.start(startTime); osc2.start(startTime); osc3.start(startTime);
                    nodesToStop.push(osc1, osc2, osc3);
                } else if (timbre === 'strings') {
                    const osc1 = ctx.createOscillator(); osc1.type = 'sawtooth'; osc1.frequency.value = freq; osc1.detune.value = -5;
                    const osc2 = ctx.createOscillator(); osc2.type = 'sawtooth'; osc2.frequency.value = freq; osc2.detune.value = 5;
                    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1200 * brightBoost;
                    if (!isScale) {
                        masterGain.gain.cancelScheduledValues(startTime);
                        masterGain.gain.setValueAtTime(0.001, startTime);
                        masterGain.gain.linearRampToValueAtTime(maxVol, startTime + 0.3); 
                        masterGain.gain.setValueAtTime(maxVol, fadeOutStart);
                        masterGain.gain.linearRampToValueAtTime(0.001, stopTime);
                    }
                    osc1.connect(filter); osc2.connect(filter); filter.connect(masterGain);
                    osc1.start(startTime); osc2.start(startTime);
                    nodesToStop.push(osc1, osc2);
                } else {
                    const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = freq;
                    osc.connect(masterGain); osc.start(startTime); nodesToStop.push(osc);
                }
                
                nodesToStop.forEach(osc => osc.stop(stopTime));
                activeNodes.push({ oscs: nodesToStop, gain: masterGain });
            });

            if (onComplete) {
                const totalDelayMs = (maxStopTime - ctx.currentTime) * 1000;
                setTimeout(onComplete, Math.max(80, totalDelayMs));
            }
        }

        function playCurrentItem(isResolution = false, onComplete = null) {
            if (!currentItemKey) return;
            const item = ALL_ITEMS[currentItemKey];
            const baseIntervals = isResolution ? item.res : item.int;
            if (!baseIntervals) {
                if (onComplete) onComplete();
                return; 
            }
            
            const rootInterval = baseIntervals[0];
            let notesData = baseIntervals.map((inter, idx) => {
                let funcInt = inter - rootInterval;
                while (funcInt < 0) funcInt += 12;
                return {
                    midi: currentBaseNote + inter,
                    functionalInterval: funcInt % 12,
                    heightIndex: idx
                };
            });
            
            const dir = DOM.direction ? DOM.direction.value : 'up';
            if (dir === 'down') {
                notesData.reverse();
            } else if (dir === 'random') {
                for (let i = notesData.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [notesData[i], notesData[j]] = [notesData[j], notesData[i]];
                }
            }

            const freqs = notesData.map(d => 440 * Math.pow(2, (d.midi - 69) / 12));
            
            const isScale = (item.cat.startsWith('scale') && !isResolution);
            const playStyle = isScale ? 'arpeggio' : DOM.playback.value;
            const delay = 320; 
            
            let speedMultiplier = 1.0;
            if (isResolution) {
                speedMultiplier = 0.45; // Очень быстрые характерные
            } else if (item.res) {
                speedMultiplier = 0.5; // Быстрые характерные
            }
            
            playFrequencies(freqs, delay, playStyle, isScale, onComplete, speedMultiplier, notesData);
        }

        function playFullSequence() {
            if (!currentItemKey) return;
            const item = ALL_ITEMS[currentItemKey];
            
            if (item && item.res) {
                playCurrentItem(false, () => {
                    if (currentItemKey === item.key) {
                        setTimeout(() => playCurrentItem(true), 50); // Минимальная пауза перед разрешением
                    }
                });
            } else {
                playCurrentItem(false);
            }
        }

        function nextItem() {
            if (activeKeys.length === 0) {
                setStatus('Выберите элементы в настройках!', 'error');
                return;
            }
            
            const randIdx = Math.floor(Math.random() * activeKeys.length);
            currentItemKey = activeKeys[randIdx];
            
            const rootOpt = DOM.root.value;
            if (rootOpt === 'random') {
                currentBaseNote = 60 + Math.floor(Math.random() * 12);
                currentBaseName = NOTE_NAMES[currentBaseNote % 12];
            } else {
                const baseOffsets = {'C':0, 'C#':1, 'D':2, 'D#':3, 'E':4, 'F':5, 'F#':6, 'G':7, 'G#':8, 'A':9, 'A#':10, 'B':11};
                currentBaseNote = 60 + baseOffsets[rootOpt];
                currentBaseName = rootOpt;
            }

            if (isVerbalMode && DOM.verbalDisplay) {
                DOM.verbalDisplay.textContent = '???';
                DOM.verbalDisplay.className = 'w-full max-w-md h-24 bg-slate-900 border border-slate-700 rounded-2xl flex flex-col items-center justify-center shadow-inner text-slate-500 font-bold text-lg px-4 text-center transition-all';
                DOM.btnShowAnswer.classList.remove('hidden');
            } else {
                document.querySelectorAll('.ans-btn').forEach(b => {
                    b.classList.remove('correct', 'wrong');
                    b.disabled = false;
                });
            }

            playFullSequence();
        }

        function handleAnswer(key, btn) {
            if (!currentItemKey) return;
            
            document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
            const isCorrect = (key === currentItemKey);
            
            if (!stats[currentItemKey]) stats[currentItemKey] = { correct: 0, total: 0 };
            stats[currentItemKey].total++;
            if (isCorrect) stats[currentItemKey].correct++;
            saveData();
            
            const item = ALL_ITEMS[currentItemKey];
            const correctName = `${item.name} (${item.short})`;

            if (isCorrect) {
                btn.classList.add('correct');
                setStatus(`✅ Верно! Правильно: ${correctName}`, 'success');
                if (!item.res) {
                    setTimeout(nextItem, 1200);
                }
            } else {
                btn.classList.add('wrong');
                const correctBtn = document.querySelector(`button[data-key="${currentItemKey}"]`);
                if(correctBtn) correctBtn.classList.add('correct');
                setStatus(`❌ Ошибка. Правильный ответ: ${correctName}`, 'error');
            }
        }

        function showVerbalAnswer() {
            if (!currentItemKey || !DOM.verbalDisplay) return;
            const item = ALL_ITEMS[currentItemKey];
            DOM.verbalDisplay.innerHTML = `${currentBaseName}: ${item.name} <span class="text-xs text-indigo-300 font-normal">(${item.short})</span>`;
            DOM.verbalDisplay.className = 'w-full max-w-md h-24 bg-emerald-950/40 border border-emerald-800/50 rounded-2xl flex flex-col items-center justify-center shadow-inner text-emerald-300 font-bold text-[15px] sm:text-base px-3 text-center transition-all leading-snug';
            DOM.btnShowAnswer.classList.add('hidden');
            
            if (!stats[currentItemKey]) stats[currentItemKey] = { correct: 0, total: 0 };
            stats[currentItemKey].total++;
            saveData();
        }

        function setStatus(text, type) {
            if(!DOM.statusBar) return;
            DOM.statusBar.innerHTML = text;
            DOM.statusBar.className = 'w-full py-2 px-3 rounded-xl text-xs font-semibold text-center shrink-0 shadow-inner flex flex-col items-center justify-center transition-all duration-300 min-h-[36px] ' + 
                (type === 'success' ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800/60' : 
                 type === 'error' ? 'bg-rose-950/80 text-rose-300 border border-rose-800/60' : 
                 'glass-panel text-indigo-300');
        }

        function handleCategoryToggle(catId, isChecked) {
            const catItems = CATS[catId].map(i => i.key);
            if (isChecked) {
                catItems.forEach(key => { if (!activeKeys.includes(key)) activeKeys.push(key); });
            } else {
                activeKeys = activeKeys.filter(key => !catItems.includes(key));
            }
            syncCheckboxes();
            updateActiveCount();
            saveData();
            buildAnswerGrid();
        }

        function syncCheckboxes() {
            document.querySelectorAll('.group-cb').forEach(cb => {
                cb.checked = activeKeys.includes(cb.value);
            });

            CATEGORIES_INFO.forEach(cat => {
                const catItems = CATS[cat.id].map(i => i.key);
                const allActive = catItems.length > 0 && catItems.every(key => activeKeys.includes(key));
                document.querySelectorAll(`.cat-master-cb[data-cat="${cat.id}"], .quick-master-cb[data-cat="${cat.id}"]`).forEach(cb => {
                    cb.checked = allActive;
                });
            });
        }

        function buildQuickToggles() {
            const container = document.getElementById('quickCategoryToggles');
            if(!container) return;
            container.innerHTML = CATEGORIES_INFO.map(cat => `
                <label class="flex items-center gap-1.5 cursor-pointer group hover:bg-slate-800/50 px-1.5 py-1 rounded transition-colors">
                    <input type="checkbox" data-cat="${cat.id}" class="custom-cb quick-master-cb border-indigo-500/50">
                    <span class="text-[9.5px] font-semibold text-slate-400 group-hover:text-indigo-200 uppercase tracking-wider">${cat.label}</span>
                </label>
            `).join('');
            
            document.querySelectorAll('.quick-master-cb').forEach(cb => {
                cb.addEventListener('change', (e) => handleCategoryToggle(e.target.dataset.cat, e.target.checked));
            });
        }

        function buildSettings() {
            let html = '';
            const createHeader = (catId, label) => `
                <label class="flex items-center gap-2 cursor-pointer mb-2 hover:bg-slate-700/40 p-1.5 rounded-lg transition-colors group border-b border-slate-700/50 pb-2">
                    <input type="checkbox" data-cat="${catId}" class="custom-cb cat-master-cb border-indigo-400/60">
                    <h4 class="text-[11px] text-indigo-300 uppercase font-extrabold tracking-widest">${label}</h4>
                </label>
            `;

            const renderCb = i => `
                <label class="flex items-center gap-1.5 cursor-pointer text-[10px] sm:text-[11px] font-medium hover:bg-slate-700/50 p-1.5 rounded-lg transition-colors bg-slate-800/30 border border-slate-700/30" title="${i.hint || ''}">
                    <input type="checkbox" value="${i.key}" class="custom-cb group-cb">

            const triadsMaj = CATS.triad.filter(i => i.triadGroup === 'maj');
            const triadsMin = CATS.triad.filter(i => i.triadGroup === 'min');
            const triadsOther = CATS.triad.filter(i => i.triadGroup === 'other');

            html += `
            <div class="bg-slate-800/30 p-2 rounded-xl border border-slate-700/50 flex flex-col md:flex-row gap-2">

                    </div>
                </div>

                </div>

                <div class="flex-1">
                    ${createHeader('d7inv', 'Обращения D7')}
                    <div class="flex flex-col gap-1">${CATS.d7inv.map(renderCb).join('')}</div>
                </div>
            </div>`;

            // ROW 3: Scales (3 columns for basic) and Modes
            const scalesMaj = CATS.scale_basic.filter(i => i.scaleGroup === 'maj');
            const scalesMin = CATS.scale_basic.filter(i => i.scaleGroup === 'min');
            const scalesOther = CATS.scale_basic.filter(i => i.scaleGroup === 'other');

            html += `
            <div class="bg-slate-800/30 p-2 rounded-xl border border-slate-700/50 flex flex-col xl:flex-row gap-2">
                <div class="flex-[1.5]">
                    ${createHeader('scale_basic', 'Базовые гаммы')}
                    <div class="grid grid-cols-3 gap-1.5">
                        <div class="flex flex-col gap-1">${scalesMaj.map(renderCb).join('')}</div>
                        <div class="flex flex-col gap-1">${scalesMin.map(renderCb).join('')}</div>
                        <div class="flex flex-col gap-1">${scalesOther.map(renderCb).join('')}</div>
                    </div>
                </div>
                <div class="w-px bg-slate-700/50 my-2 hidden xl:block"></div>
                <div class="flex-1">
                    ${createHeader('scale_modes', 'Народные лады и Пентатоника')}
                    <div class="grid grid-cols-2 gap-1.5">

            if(DOM.settingsContent) DOM.settingsContent.innerHTML = html;

            document.querySelectorAll('.group-cb').forEach(cb => {
                cb.addEventListener('change', () => {

                    syncCheckboxes();

                    saveData();
                    buildAnswerGrid();

            document.querySelectorAll('.cat-master-cb').forEach(cb => {
                cb.addEventListener('change', (e) => handleCategoryToggle(e.target.dataset.cat, e.target.checked));
            });

        function buildAnswerGrid() {
            let html = '';
            
            const renderBtn = (i) => `
                <button class="ans-btn py-2 px-1.5 rounded-lg text-[11px] sm:text-xs font-semibold text-slate-200 flex flex-col items-center justify-center leading-tight shadow-sm w-full h-full" data-key="${i.key}" onclick="handleAnswer('${i.key}', this)">
                    <span class="text-center">${i.short}</span>
                    ${i.hint ? `<span class="text-[9px] text-indigo-300/90 mt-0.5 font-bold tracking-wider">${i.hint}</span>` : ''}
                </button>`;

            const addStructuredSection = (title, colsArray) => {
                const hasActive = colsArray.some(col => col.some(k => activeKeys.includes(k)));
                if (!hasActive) return;

                html += `
                <div class="mb-2">
                    <h4 class="text-[10px] text-slate-400 uppercase mb-1.5 pl-1 tracking-widest font-bold border-b border-slate-700/40 pb-1">${title}</h4>
                    <div class="grid grid-cols-3 gap-2">
                        ${colsArray.map(col => `
                            <div class="flex flex-col gap-1.5">
                                ${col.filter(k => activeKeys.includes(k)).map(k => renderBtn(ALL_ITEMS[k])).join('')}
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            };

            const addSection = (title, itemsArr) => {
                const activeItems = itemsArr.filter(i => activeKeys.includes(i.key));
                if (activeItems.length === 0) return;
                
                html += `
                <div class="mb-2">
                    <h4 class="text-[10px] text-slate-400 uppercase mb-1.5 pl-1 tracking-widest font-bold border-b border-slate-700/40 pb-1">${title}</h4>
                    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-1.5">
                        ${activeItems.map(renderBtn).join('')}
                    </div>
                </div>`;
            };

            const activeSimple = CATS.simple.filter(i => activeKeys.includes(i.key));
            const activeChar = CATS.char.filter(i => activeKeys.includes(i.key));
            
            if (activeSimple.length > 0 || activeChar.length > 0) {
                html += `<div class="flex flex-col md:flex-row gap-2 md:gap-4 mb-2">`;
                if (activeSimple.length > 0) {
                    html += `<div class="flex-1">
                        <h4 class="text-[10px] text-slate-400 uppercase mb-1.5 pl-1 tracking-widest font-bold border-b border-slate-700/40 pb-1">Простые интервалы</h4>
                        <div class="grid grid-cols-2 gap-1.5">
                            ${activeSimple.map(renderBtn).join('')}
                        </div>
                    </div>`;
                }
                if (activeChar.length > 0) {
                    html += `<div class="flex-1">
                        <h4 class="text-[10px] text-slate-400 uppercase mb-1.5 pl-1 tracking-widest font-bold border-b border-slate-700/40 pb-1">Характерные интервалы</h4>
                        <div class="grid grid-cols-2 gap-1.5">
                            ${activeChar.map(renderBtn).join('')}
                        </div>
                    </div>`;
                }
                html += `</div>`;
            }

            const triadsMajKeys = CATS.triad.filter(i => i.triadGroup === 'maj').map(i => i.key);
            const triadsMinKeys = CATS.triad.filter(i => i.triadGroup === 'min').map(i => i.key);
            const triadsOtherKeys = CATS.triad.filter(i => i.triadGroup === 'other').map(i => i.key);

            addStructuredSection('Трезвучия', [triadsMajKeys, triadsMinKeys, triadsOtherKeys]);
            addSection('Септаккорды', CATS.seventh);
            addSection('Обращения D7', CATS.d7inv);
            
            const scalesMajKeys = CATS.scale_basic.filter(i => i.scaleGroup === 'maj').map(i => i.key);
            const scalesMinKeys = CATS.scale_basic.filter(i => i.scaleGroup === 'min').map(i => i.key);
            const scalesOtherKeys = CATS.scale_basic.filter(i => i.scaleGroup === 'other').map(i => i.key);

            addStructuredSection('Базовые Гаммы', [scalesMajKeys, scalesMinKeys, scalesOtherKeys]);
            addSection('Народные Лады и Пентатоника', CATS.scale_modes);

            if (!html) html = '<div class="text-center text-slate-500 text-sm font-medium py-10">В настройках (⚙️) ничего не выбрано.</div>';
            if(DOM.answersWrap) DOM.answersWrap.innerHTML = html;
        }

        function updateActiveCount() {
            if(DOM.activeCount) DOM.activeCount.textContent = activeKeys.length;
        }

        function updateStatsUI() {
            let totalAnswers = 0;
            let correctAnswers = 0;
            let html = '';

            CATEGORIES_INFO.forEach(cat => {
                const catKeys = activeKeys.filter(k => ALL_ITEMS[k] && ALL_ITEMS[k].cat === cat.id);
                if (catKeys.length === 0) return;
                
                html += `<div class="mt-3 mb-1.5 pl-1 text-[10px] uppercase font-bold text-slate-400 tracking-widest border-b border-slate-700/50 pb-1">${cat.label}</div>`;
                
                catKeys.forEach(key => {
                    const s = stats[key] || { correct: 0, total: 0 };
                    totalAnswers += s.total;
                    correctAnswers += s.correct;
                    const perc = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
                    const item = ALL_ITEMS[key];
                    
                    html += `
                    <div class="flex justify-between items-center text-xs py-1.5 px-2 hover:bg-slate-800/50 rounded transition-colors border-b border-slate-700/30">
                        <span class="text-slate-300 truncate pr-2 font-medium">${item.name} <span class="text-[10px] text-slate-500 ml-1">(${item.short})</span></span>
                        <span class="${perc > 80 ? 'text-emerald-400' : perc > 50 ? 'text-amber-400' : 'text-rose-400'} font-bold">
                            ${perc}% <span class="text-[10px] text-slate-500 font-medium ml-1">(${s.correct}/${s.total})</span>
                        </span>
                    </div>`;
                });
            });

            const overallPerc = totalAnswers > 0 ? Math.round((correctAnswers / totalAnswers) * 100) : 0;
            if(DOM.overallAccuracy) {
                DOM.overallAccuracy.textContent = `Общая точность: ${overallPerc}%`;
                DOM.overallAccuracy.className = `text-center text-sm font-extrabold mb-3 py-2.5 rounded-xl shadow-inner border tracking-wide ` + 
                    (overallPerc > 80 ? 'bg-emerald-950/50 text-emerald-300 border-emerald-800/80' : 
                     overallPerc > 50 ? 'bg-amber-950/50 text-amber-300 border-amber-800/80' : 
                     'bg-slate-800 text-white border-slate-600');
            }
            
            if(DOM.detailedStats) DOM.detailedStats.innerHTML = html || '<div class="text-center text-slate-500 text-xs py-6">Нет данных для отображения.</div>';
        }

        function toggleVerbalMode() {
            if(!DOM.verbalCb) return;
            isVerbalMode = DOM.verbalCb.checked;
            if (isVerbalMode) {
                DOM.answersWrap.classList.add('hidden');
                document.getElementById('actionControls').classList.add('hidden');
                DOM.verbalWrap.classList.remove('hidden');
                DOM.verbalWrap.classList.add('flex');
            } else {
                DOM.answersWrap.classList.remove('hidden');
                document.getElementById('actionControls').classList.remove('hidden');
                DOM.verbalWrap.classList.add('hidden');
                DOM.verbalWrap.classList.remove('flex');
            }
            saveData();
        }

        async function saveData() {
            const data = {
                activeKeys,
                stats,
                tempo: DOM.tempo ? DOM.tempo.value : 'slow',
                playback: DOM.playback ? DOM.playback.value : 'arpeggio',
                direction: DOM.direction ? DOM.direction.value : 'up',
                timbre: DOM.timbre ? DOM.timbre.value : 'piano',
                root: DOM.root ? DOM.root.value : 'random',
                volume: DOM.volumeSlider ? parseFloat(DOM.volumeSlider.value) : 0.5,
                verbal: DOM.verbalCb ? DOM.verbalCb.checked : false
            };
            await setSavedData('trainerState_v6', data);
        }

        async function loadData() {
            const data = await getSavedData('trainerState_v6');
            if (data) {
                if (data.activeKeys && data.activeKeys.length > 0) activeKeys = data.activeKeys;
                if (data.stats) stats = data.stats;
                if (data.tempo && DOM.tempo) DOM.tempo.value = data.tempo;
                if (data.playback && DOM.playback) DOM.playback.value = data.playback;
                if (data.direction && DOM.direction) DOM.direction.value = data.direction;
                if (data.timbre && DOM.timbre) DOM.timbre.value = data.timbre;
                if (typeof data.volume !== 'undefined' && DOM.volumeSlider) DOM.volumeSlider.value = data.volume;
                if (typeof data.verbal !== 'undefined' && DOM.verbalCb) DOM.verbalCb.checked = data.verbal;
            }
        }

        async function init() {
            await loadData();
            
            buildSettings();
            buildQuickToggles();
            syncCheckboxes();
            buildAnswerGrid();
            updateActiveCount();
            toggleVerbalMode();
            
            if(DOM.btnNew) DOM.btnNew.onclick = nextItem;
            if(DOM.btnVerbalNew) DOM.btnVerbalNew.onclick = nextItem;
            if(DOM.btnRepeat) DOM.btnRepeat.onclick = () => playFullSequence();
            if(DOM.btnVerbalRepeat) DOM.btnVerbalRepeat.onclick = () => playFullSequence();
            if(DOM.btnShowAnswer) DOM.btnShowAnswer.onclick = showVerbalAnswer;
            
            if(DOM.btnSettings) DOM.btnSettings.onclick = () => {
                DOM.settingsModal.classList.remove('hidden');
                DOM.settingsModal.classList.add('flex');
            };
            if(DOM.btnCloseSettings) DOM.btnCloseSettings.onclick = () => {
                DOM.settingsModal.classList.add('hidden');
                DOM.settingsModal.classList.remove('flex');
            };
            
            if(DOM.btnStats) {
                DOM.btnStats.onclick = () => {
                    updateStatsUI();
                    DOM.statsModal.classList.remove('hidden');
                    DOM.statsModal.classList.add('flex');
                };
            }
            if(DOM.btnCloseStats) {
                DOM.btnCloseStats.onclick = () => {
                    DOM.statsModal.classList.add('hidden');
                    DOM.statsModal.classList.remove('flex');
                };
            }

            if(DOM.settingsModal) DOM.settingsModal.onclick = (e) => {
                if(e.target === DOM.settingsModal) DOM.btnCloseSettings.click();
            };
            if(DOM.statsModal) DOM.statsModal.onclick = (e) => {
                if(e.target === DOM.statsModal) DOM.btnCloseStats.click();
            };
            
            if(DOM.btnResetStats) {
                DOM.btnResetStats.onclick = () => {
                    if(confirm('Сбросить всю статистику?')) {
                        stats = {};
                        saveData();
                        updateStatsUI();
                    }
                };
            }
            
            if(DOM.verbalCb) DOM.verbalCb.onchange = toggleVerbalMode;
            if(DOM.tempo) DOM.tempo.onchange = saveData;
            if(DOM.playback) DOM.playback.onchange = saveData;
            if(DOM.direction) DOM.direction.onchange = saveData;
            if(DOM.timbre) DOM.timbre.onchange = saveData;
            if(DOM.root) DOM.root.onchange = saveData;
            if(DOM.volumeSlider) DOM.volumeSlider.oninput = saveData;

            ['touchstart', 'touchend', 'click'].forEach(evt => {
                document.body.addEventListener(evt, unlockAudio, { once: true });
            });
        }

        window.onload = init;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" class="h-[100dvh]">
<head>

    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#090d16">
    <title>Тренажер аккордов на слух</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 9999px;
        }
        .custom-cb {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #475569;
            border-radius: 4px;
            background-color: #1e293b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }
        .custom-cb:checked {
            background-color: #6366f1;
            border-color: #6366f1;
        }
        .custom-cb:checked::after {
            content: "✓";
            font-size: 10px;
            color: white;
            font-weight: bold;
            line-height: 1;
        }
        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 10px;
            padding-right: 20px !important;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col justify-between p-2 sm:p-3 max-w-4xl mx-auto overflow-hidden bg-slate-950 text-slate-100">

    <header class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl py-1.5 px-2.5 shadow-md shrink-0 flex flex-wrap justify-between items-center gap-1.5">

                <option value="very_slow">Очень медл. (0.6с)</option>
                <option value="slow">Медленный (0.4с)</option>
                <option value="normal" selected>Умеренный (0.25с)</option>
                <option value="fast">Быстрый (0.15с)</option>
            </select>
            <select id="playbackStyleSelect" class="bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1 text-[11px] text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium">
                <option value="arpeggio" selected>Арпеджио</option>
                <option value="harmonic">Гармонически</option>
            </select>
            <select id="rootSelect" class="bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1 text-[11px] text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium">
                <option value="random">Любой тон</option>
                <option value="C">До (C)</option>
                <option value="D">Ре (D)</option>
                <option value="E">Ми (E)</option>
                <option value="F">Фа (F)</option>
                <option value="G">Соль (G)</option>
                <option value="A">Ля (A)</option>
                <option value="B">Си (B)</option>
            </select>
        </div>

        <div class="flex items-center gap-1.5 text-xs">
            <div id="quickTogglesContainer" class="flex items-center gap-1 flex-wrap">
                <!-- Filled dynamically with ascetic pill toggles -->
            </div>
            <div class="flex items-center gap-1 border-l border-slate-800 pl-1.5">
                <button id="toggleSettingsBtn" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 font-medium rounded-lg text-xs border border-slate-700 flex items-center gap-1 transition" title="Настройки">
                    ⚙️ <span id="activeCountBadge" class="bg-indigo-950 px-1 py-0.5 rounded text-[10px] font-bold text-indigo-200">5</span>
                </button>
                <button id="toggleDetailedStats" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-emerald-300 font-medium rounded-lg text-xs border border-slate-700 flex items-center gap-1 transition" title="Статистика">
                    📊
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col justify-between overflow-hidden my-1.5 gap-1.5">
        <div class="w-full bg-slate-900/80 border border-slate-800/90 rounded-2xl shadow-xl p-2.5 sm:p-3.5 flex flex-col justify-between h-full gap-2 overflow-hidden backdrop-blur-sm">
            
            <!-- Settings Modal -->
            <div id="chordSettingsModal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-2 hidden">
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-3 max-w-xl w-full space-y-2 shadow-2xl flex flex-col max-h-[92vh]">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-1.5 shrink-0">
                        <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Настройка категорий</h3>
                        <div class="flex gap-2 text-xs">
                            <button id="selectAllBtn" class="text-indigo-400 hover:underline font-medium">Все</button>
                            <span class="text-slate-600">|</span>
                            <button id="deselectAllBtn" class="text-slate-400 hover:underline font-medium">Сбросить</button>
                        </div>
                    </div>
                    <div id="chordTypesContainer" class="grid grid-cols-1 gap-2 text-xs overflow-y-auto pr-1 flex-grow">
                        <!-- Filled dynamically -->
                    </div>
                    <div class="flex justify-end pt-1.5 border-t border-slate-800 shrink-0">
                        <button id="closeSettingsBtn" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md transition">Готово</button>
                    </div>
                </div>
            </div>

            <!-- Statistics Modal -->
            <div id="detailedStatsBox" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3 hidden">
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 max-w-lg w-full space-y-3 shadow-2xl flex flex-col max-h-[90vh]">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2 shrink-0">
                        <div class="flex items-center gap-3 text-xs">
                            <span class="font-bold text-indigo-400 uppercase">Статистика</span>
                            <span class="text-slate-400">Верно: <strong id="modalCorrectCount" class="text-emerald-400">0</strong></span>
                            <span class="text-slate-400">Всего: <strong id="modalTotalCount" class="text-slate-200">0</strong></span>
                            <span class="text-slate-400">Точность: <strong id="modalAccuracyCount" class="text-indigo-300">0%</strong></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="resetStatsBtn" class="text-rose-400 hover:text-rose-300 text-xs underline">Сбросить</button>
                            <button id="closeStatsModalBtn" class="text-slate-400 hover:text-white text-xs font-bold px-2 py-1">✕</button>
                        </div>
                    </div>
                    <div id="detailedStatsList" class="space-y-3 text-xs overflow-y-auto pr-1 flex-grow">

                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3 shrink-0">
                <button id="playBtn" class="flex-1 py-2 px-6 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-xl shadow transition text-xs flex items-center justify-center gap-2">

                    🔁 Повтор
                </button>
            </div>

            <div class="space-y-1.5 flex-grow flex flex-col justify-start overflow-hidden min-h-0">

                </div>
                <div id="answersContainer" class="space-y-2 overflow-y-auto pr-1 flex-grow">
                    <!-- Dynamic answer buttons -->
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        const CHORD_CATEGORIES = {

                            'int_M7': { name: 'Большая септима', rawShort: 'б.7', intervals: [0, 11], type: 'interval' }
                        }

            },
            'Характерные интервалы': {

                subgroups: [
                    {

                        chords: {
                            'int_aug4_min': { name: 'Увеличенная кварта (в миноре)', rawShort: 'Ув.4 (мин)', intervals: [0, 6], resolution: [-1, 7], resolutionText: 'разрешение в большую сексту (б.6) в натуральном миноре', type: 'characteristic_interval' },

                            'int_dim5_min': { name: 'Уменьшенная квинта (в миноре)', rawShort: 'Ум.5 (мин)', intervals: [0, 6], resolution: [1, 5], resolutionText: 'разрешение в малую терцию (м.3) в натуральном миноре', type: 'characteristic_interval' },
                            'int_dim5_maj': { name: 'Уменьшенная квинта (в мажоре)', rawShort: 'Ум.5 (маж)', intervals: [0, 6], resolution: [-1, 4], resolutionText: 'разрешение в малую терцию (м.3) в натуральном мажоре', type: 'characteristic_interval' },
                            'int_aug2': { name: 'Увеличенная секунда', rawShort: 'Ув.2', intervals: [0, 3], resolution: [-1, 5], resolutionText: 'разрешение в чистую кварту (ч.4) в гармоническом миноре', type: 'characteristic_interval' },
                            'int_dim7': { name: 'Уменьшенная септима', rawShort: 'Ум.7', intervals: [0, 9], resolution: [1, 7], resolutionText: 'разрешение в чистую квинту (ч.5) в гармоническом мажоре/миноре', type: 'characteristic_interval' },
                            'int_aug5_min': { name: 'Увеличенная квинта (в миноре)', rawShort: 'Ув.5 (мин)', intervals: [0, 8], resolution: [-1, 9], resolutionText: 'разрешение в большую сексту (б.6) в гармоническом миноре', type: 'characteristic_interval' },
                            'int_aug5_maj': { name: 'Увеличенная квинта (в мажоре)', rawShort: 'Ув.5 (маж)', intervals: [0, 8], resolution: [1, 8], resolutionText: 'разрешение в большую сексту (б.6) в гармоническом мажоре', type: 'characteristic_interval' },
                            'int_dim4_min': { name: 'Уменьшенная кварта (в миноре)', rawShort: 'Ум.4 (мин)', intervals: [0, 4], resolution: [1, 5], resolutionText: 'разрешение в малую терцию (м.3) в гармоническом миноре', type: 'characteristic_interval' },
                            'int_dim4_maj': { name: 'Уменьшенная кварта (в мажоре)', rawShort: 'Ум.4 (маж)', intervals: [0, 4], resolution: [-1, 4], resolutionText: 'разрешение в малую терцию (м.3) в гармоническом мажоре', type: 'characteristic_interval' }
                        }
                    }
                ]
            },
            'Трезвучия': {
                shortName: 'Трезв.',
                subgroups: [
                    {
                        title: 'Основные трезвучия',
                        chords: {
                            'triad_maj': { name: 'Мажорное трезвучие', rawShort: 'Б5', intervals: [0, 4, 7], type: 'chord' },
                            'triad_min': { name: 'Минорное трезвучие', rawShort: 'М5', intervals: [0, 3, 7], type: 'chord' },
                            'triad_dim': { name: 'Уменьшенное трезвучие', rawShort: 'Ум5', intervals: [0, 3, 6], type: 'chord' },
                            'triad_aug': { name: 'Увеличенный аккорд', rawShort: 'Ув5', intervals: [0, 4, 8], type: 'chord' }
                        }

                    {
                        title: 'Обращения трезвучий',
                        chords: {
                            'inv_maj_6': { name: 'Мажорный секстаккорд', rawShort: 'Б6', intervals: [0, 3, 8], type: 'chord' },
                            'inv_maj_64': { name: 'Мажорный квартсекстаккорд', rawShort: 'Б6/4', intervals: [0, 5, 9], type: 'chord' },
                            'inv_min_6': { name: 'Минорный секстаккорд', rawShort: 'М6', intervals: [0, 4, 9], type: 'chord' },
                            'inv_min_64': { name: 'Минорный квартсекстаккорд', rawShort: 'М6/4', intervals: [0, 5, 8], type: 'chord' }
                        }
                    }
                ]
            },
            'Септаккорды': {
                shortName: 'Септ.',
                subgroups: [
                    {
                        title: 'Основные септаккорды',
                        chords: {
                            'mb7': { name: 'Малый мажорный септаккорд', rawShort: 'МБ7', intervals: [0, 4, 7, 10], type: 'chord' },
                            'bb7': { name: 'Большой мажорный септаккорд', rawShort: 'ББ7', intervals: [0, 4, 7, 11], type: 'chord' },
                            'mm7': { name: 'Малый минорный септаккорд', rawShort: 'ММ7', intervals: [0, 3, 7, 10], type: 'chord' },
                            'bm7': { name: 'Большой минорный септаккорд', rawShort: 'БМ7', intervals: [0, 3, 7, 11], type: 'chord' },
                            'm7b5': { name: 'Полууменьшенный септаккорд', rawShort: 'Мø7', intervals: [0, 3, 6, 10], type: 'chord' },
                            'dim7': { name: 'Уменьшенный септаккорд', rawShort: 'УМ7', intervals: [0, 3, 6, 9], type: 'chord' },
                            'aug7': { name: 'Увеличенный септаккорд', rawShort: 'УВ7', intervals: [0, 4, 8, 11], type: 'chord' }

                    },
                    {
                        title: 'Обращения доминантсептаккорда',
                        chords: {
                            'dom7': { name: 'Доминантсептаккорд', rawShort: 'D7', intervals: [0, 4, 7, 10], type: 'chord' },
                            'dom65': { name: 'Квинтсекстаккорд', rawShort: 'D6/5', intervals: [0, 3, 6, 8], type: 'chord' },
                            'dom43': { name: 'Терцквартаккорд', rawShort: 'D4/3', intervals: [0, 3, 5, 9], type: 'chord' },
                            'dom2': { name: 'Секундаккорд', rawShort: 'D2', intervals: [0, 2, 6, 9], type: 'chord' }
                        }
                    }
                ]
            },
            'Лады и гаммы': {
                shortName: 'Лады',
                subgroups: [
                    {
                        title: 'Основные лады',
                        isMajorMinorRows: true,
                        rows: [
                            {
                                maj: { name: 'Натуральный мажор', rawShort: 'Натур. мажор', hint: '', intervals: [0, 2, 4, 5, 7, 9, 11, 12], type: 'scale' },
                                min: { name: 'Натуральный минор', rawShort: 'Натур. минор', hint: '', intervals: [0, 2, 3, 5, 7, 8, 10, 12], type: 'scale' }
                            },
                            {
                                maj: { name: 'Гармонический мажор', rawShort: 'Гарм. мажор', hint: 'b6', intervals: [0, 2, 4, 5, 7, 8, 11, 12], type: 'scale' },
                                min: { name: 'Гармонический минор', rawShort: 'Гарм. минор', hint: '#7', intervals: [0, 2, 3, 5, 7, 8, 11, 12], type: 'scale' }
                            },
                            {
                                maj: { name: 'Мелодический мажор', rawShort: 'Мелод. мажор', hint: 'b6,b7', intervals: [0, 2, 4, 5, 7, 8, 10, 12], type: 'scale' },
                                min: { name: 'Мелодический минор', rawShort: 'Мелод. минор', hint: '#6,#7', intervals: [0, 2, 3, 5, 7, 9, 11, 12], type: 'scale' }

                        ]
                    },
                    {
                        title: 'Лады народной музыки',
                        chords: {

                            'mode_dorian': { name: 'Дорийский лад', rawShort: 'Дорийский', hint: '#6', intervals: [0, 2, 3, 5, 7, 9, 10], type: 'scale' },
                            'mode_phrygian': { name: 'Фригийский лад', rawShort: 'Фригийский', hint: 'b2', intervals: [0, 1, 3, 5, 7, 8, 10], type: 'scale' },
                            'mode_locrian': { name: 'Локрийский лад', rawShort: 'Локрийский', hint: 'b2,b5', intervals: [0, 1, 3, 5, 6, 8, 10], type: 'scale' }

                            'pent_min': { name: 'Минорная пентатоника', rawShort: 'Мин. пентатоника', hint: '5 ст.', intervals: [0, 3, 5, 7, 10, 12], type: 'scale' },
                            'double_harm_maj': { name: 'Дважды гармонический мажор', rawShort: 'Дв. гарм. мажор', hint: 'b2,b6', intervals: [0, 1, 4, 5, 7, 8, 11, 12], type: 'scale' },
                            'double_harm_min': { name: 'Дважды гармонический минор', rawShort: 'Дв. гарм. минор', hint: '#4,#7', intervals: [0, 2, 3, 6, 7, 8, 11, 12], type: 'scale' }
                        }
                    }
                ]
            }
        };

        const ALL_CHORDS = {};
        for (const cat in CHORD_CATEGORIES) {
            CHORD_CATEGORIES[cat].subgroups.forEach(sub => {
                if (sub.isMajorMinorRows) {
                    const majKeys = ['scale_nat_maj', 'scale_harm_maj', 'scale_mel_maj'];
                    const minKeys = ['scale_nat_min', 'scale_harm_min', 'scale_mel_min'];
                    sub.rows.forEach((row, idx) => {
                        ALL_CHORDS[majKeys[idx]] = row.maj;
                        ALL_CHORDS[minKeys[idx]] = row.min;
                    });
                } else if (sub.chords) {
                    for (const key in sub.chords) {
                        ALL_CHORDS[key] = sub.chords[key];
                    }
                }
            });
        }

        const NOTE_OFFSETS = {
            'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
            'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8,
            'Ab': 8, 'A': 9, 'A#': 10, 'Bb': 10, 'B': 11
        };

        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        let audioCtx = null;
        let currentChord = null;
        let currentRoot = null;
        let stats = { correct: 0, total: 0 };
        let chordStats = {}; 
        let canAnswer = false;
        let activeNodes = []; 
        let playbackTimer = null;

        for (const key in ALL_CHORDS) {
            chordStats[key] = { correct: 0, total: 0 };
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        let db = null, auth = null, userId = null;

        const tempoSelect = document.getElementById('tempoSelect');
        const playbackStyleSelect = document.getElementById('playbackStyleSelect');
        const rootSelect = document.getElementById('rootSelect');
        const chordTypesContainer = document.getElementById('chordTypesContainer');

        async function initFirebase() {
            if (!firebaseConfig) return;
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                userId = auth.currentUser?.uid;
                if (userId) {
                    await loadUserData();
                }
            } catch (e) {
                console.error("Firebase init error:", e);
            }
        }

        async function saveUserData() {
            if (!userId || !db) return;
            const activeCheckboxes = {};
            document.querySelectorAll('.chord-checkbox').forEach(cb => {
                activeCheckboxes[cb.value] = cb.checked;
            });
            const dataToSave = {
                tempo: tempoSelect.value,
                playbackStyle: playbackStyleSelect.value,
                root: rootSelect.value,
                checkboxes: activeCheckboxes,
                stats: stats,
                chordStats: chordStats
            };
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'user_data', 'profile');
                await setDoc(docRef, dataToSave, { merge: true });
            } catch (e) {
                console.error("Save error:", e);
            }
        }

        async function loadUserData() {
            if (!userId || !db) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'user_data', 'profile');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.tempo) tempoSelect.value = data.tempo;
                    if (data.playbackStyle) playbackStyleSelect.value = data.playbackStyle;
                    if (data.root) rootSelect.value = data.root;
                    if (data.checkboxes) {
                        for (const [key, val] of Object.entries(data.checkboxes)) {
                            const cb = document.querySelector(`.chord-checkbox[value="${key}"]`);
                            if (cb) cb.checked = val;
                        }
                    }
                    if (data.stats) {
                        stats = data.stats;
                        updateStatsDisplay();
                    }
                    if (data.chordStats) {
                        for (const [key, val] of Object.entries(data.chordStats)) {
                            if (chordStats[key]) chordStats[key] = val;
                        }
                    }
                    updateActiveBadge();
                    renderAnswerButtons();
                    prepareNewQuestion();
                }
            } catch (e) {
                console.error("Load error:", e);
            }
        }

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function stopActiveNotes() {
            if (playbackTimer) {
                clearTimeout(playbackTimer);
                playbackTimer = null;
            }
            const ctx = getAudioContext();
            activeNodes.forEach(node => {
                try {
                    node.gain.gain.cancelScheduledValues(ctx.currentTime);
                    node.gain.gain.setValueAtTime(node.gain.gain.value, ctx.currentTime);
                    node.gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.02);
                    node.osc.stop(ctx.currentTime + 0.03);
                } catch(e) {}
            });
            activeNodes = [];
        }

        function midiToFreq(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function playTone(freq, startTime, duration, isSustained = false) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const masterVol = 0.8;

            const attackTime = 0.03;
            const releaseTime = isSustained ? 0.35 : Math.min(0.2, duration * 0.25);

            osc.type = 'sine';
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.18 * masterVol, startTime + attackTime);
            
            const releaseStart = Math.max(startTime + attackTime, startTime + duration - releaseTime);
            gain.gain.setValueAtTime(0.18 * masterVol, releaseStart);
            gain.gain.linearRampToValueAtTime(0.0001, startTime + duration);

            osc.frequency.setValueAtTime(freq, startTime);
            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);

            const nodeObj = { osc, gain };
            activeNodes.push(nodeObj);
            setTimeout(() => {
                const idx = activeNodes.indexOf(nodeObj);
                if (idx !== -1) activeNodes.splice(idx, 1);
            }, (startTime - ctx.currentTime + duration) * 1000);
        }

        function playCurrentChord() {
            const ctx = getAudioContext();
            if (!currentChord) {
                prepareNewQuestion();
            }
            stopActiveNotes(); 
            
            const now = ctx.currentTime + 0.05;
            const tempoSetting = tempoSelect.value;
            const playbackStyle = playbackStyleSelect.value;
            const chordObj = ALL_CHORDS[currentChord];

            const stepTime = tempoSetting === 'very_slow' ? 0.6 : (tempoSetting === 'slow' ? 0.4 : (tempoSetting === 'fast' ? 0.15 : 0.25));
            const rootNoteName = currentRoot;
            const rootMidi = 60 + NOTE_OFFSETS[rootNoteName];
            const intervals = chordObj.intervals;

            let duration = 2.5;

            if (chordObj.type === 'scale') {
                const isFolkOrPent = currentChord.startsWith('mode_') || currentChord.startsWith('pent_');
                const scaleStep = stepTime; 
                duration = intervals.length * scaleStep + 0.4;
                
                intervals.forEach((interval, idx) => {
                    const freq = midiToFreq(rootMidi + interval);
                    const noteStart = now + idx * scaleStep;
                    const noteDuration = scaleStep + (isFolkOrPent ? 0.45 : 0.35); 
                    playTone(freq, noteStart, noteDuration, true);
                });
            } else if (chordObj.type === 'interval') {
                duration = 3.2;
                const freq1 = midiToFreq(rootMidi + intervals[0]);
                const freq2 = midiToFreq(rootMidi + intervals[1]);

                if (playbackStyle === 'harmonic') {
                    playTone(freq1, now, duration, true);
                    playTone(freq2, now, duration, true);
                } else {
                    playTone(freq1, now, duration, true);
                    playTone(freq2, now + 0.8, duration - 0.8, true);
                }
            } else if (chordObj.type === 'characteristic_interval') {
                const baseDuration = 1.8;
                const microPause = 0.7;

                const freq1 = midiToFreq(rootMidi + intervals[0]);
                const freq2 = midiToFreq(rootMidi + intervals[1]);

                if (playbackStyle === 'harmonic') {
                    playTone(freq1, now, baseDuration, true);
                    playTone(freq2, now, baseDuration, true);
                } else {
                    playTone(freq1, now, baseDuration, true);
                    playTone(freq2, now + 0.7, baseDuration - 0.7, true);
                }

                const resStart = now + baseDuration + microPause;
                const resFreq1 = midiToFreq(rootMidi + chordObj.resolution[0]);
                const resFreq2 = midiToFreq(rootMidi + chordObj.resolution[1]);

                if (playbackStyle === 'harmonic') {
                    playTone(resFreq1, resStart, baseDuration, true);
                    playTone(resFreq2, resStart, baseDuration, true);
                } else {
                    playTone(resFreq1, resStart, baseDuration, true);
                    playTone(resFreq2, resStart + 0.7, baseDuration - 0.7, true);
                }

                duration = (resStart + baseDuration) - now + 0.3;
            } else if (playbackStyle === 'arpeggio') {
                duration = 3.5;
                intervals.forEach((interval, idx) => {
                    const freq = midiToFreq(rootMidi + interval);
                    const noteStart = now + idx * stepTime;
                    const noteDuration = duration - (idx * stepTime);
                    playTone(freq, noteStart, noteDuration, true);
                });
            } else {
                duration = 2.8;
                intervals.forEach(interval => {
                    const freq = midiToFreq(rootMidi + interval);
                    playTone(freq, now, duration, true);
                });
            }
        }

        function createAnswerButton(typeKey, chordInfo) {
            const btn = document.createElement('button');
            btn.className = 'py-1.5 px-1 bg-slate-800/90 hover:bg-slate-700 active:bg-slate-600 rounded-xl text-xs font-medium text-slate-200 transition text-center border border-slate-700/80 flex flex-col items-center justify-center shadow-sm';
            btn.dataset.chordKey = typeKey;
            
            if (chordInfo.hint && chordInfo.type === 'scale') {
                btn.innerHTML = `<span class="font-bold text-indigo-300 leading-tight">${chordInfo.rawShort}</span><span class="text-[9px] text-slate-400 font-mono mt-0.5">${chordInfo.hint}</span>`;
            } else {
                btn.innerHTML = `<span class="font-bold text-indigo-300 leading-tight">${chordInfo.rawShort}</span>`;
            }
            
            btn.onclick = () => handleAnswer(typeKey, btn);
            return btn;
        }

        function areIntervalsEqual(arr1, arr2) {
            if (arr1.length !== arr2.length) return false;
            return arr1.every((val, idx) => val === arr2[idx]);
        }

        function handleAnswer(selectedKey, buttonElement) {
            if (!canAnswer) return;
            canAnswer = false;

            stats.total++;
            chordStats[currentChord].total++;
            
            const selectedChord = ALL_CHORDS[selectedKey];
            const currentChordObj = ALL_CHORDS[currentChord];
            
            const isCorrect = (selectedKey === currentChord) || 
                              (currentChordObj.type !== 'characteristic_interval' && areIntervalsEqual(selectedChord.intervals, currentChordObj.intervals));

            if (isCorrect) {
                stats.correct++;
                chordStats[currentChord].correct++;
            }

            const allButtons = document.querySelectorAll('#answersContainer button');
            allButtons.forEach(btn => {
                const btnChord = ALL_CHORDS[btn.dataset.chordKey];
                if (btnChord && (btn.dataset.chordKey === currentChord || areIntervalsEqual(btnChord.intervals, currentChordObj.intervals))) {
                    btn.classList.add('bg-emerald-600/30', 'border-emerald-500', 'text-emerald-200');
                }
            });

            let chordDesc = `${currentRoot} ${currentChordObj.name}`;
            if (currentChordObj.resolutionText) {
                chordDesc += ` (${currentChordObj.resolutionText})`;
            }

            if (isCorrect) {
                buttonElement.classList.remove('bg-slate-800/90', 'hover:bg-slate-700');
                buttonElement.classList.add('bg-emerald-600', 'border-emerald-400', 'text-white');
                showFeedback(`✓ Верно: ${chordDesc}`, 'success');

                updateStatsDisplay();
                saveUserData();

                setTimeout(() => {
                    prepareNewQuestion();
                    playCurrentChord();
                }, 900);
            } else {
                buttonElement.classList.remove('bg-slate-800/90', 'hover:bg-slate-700');
                buttonElement.classList.add('bg-rose-600/80', 'border-rose-400', 'text-white');
                showFeedback(`✗ Неверно: это был ${chordDesc}`, 'error');

                updateStatsDisplay();
                saveUserData();
            }
        }

        function showFeedback(text, type) {
            statusFeedbackBar.textContent = text;
            statusFeedbackBar.className = 'w-full py-2 px-4 rounded-xl text-xs font-semibold text-center shrink-0 transition-all border shadow-md';
            
            if (type === 'success') {
                statusFeedbackBar.classList.add('bg-emerald-950/85', 'text-emerald-200', 'border-emerald-700');
            } else if (type === 'error') {
                statusFeedbackBar.classList.add('bg-rose-950/85', 'text-rose-200', 'border-rose-700');
            } else {
                statusFeedbackBar.classList.add('bg-slate-900/95', 'text-indigo-300', 'border-slate-800');
            }
        }

        function updateStatsDisplay() {
            modalCorrectCount.textContent = stats.correct;
            modalTotalCount.textContent = stats.total;
            const accuracy = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
            modalAccuracyCount.textContent = accuracy + '%';
        }

        function updateDetailedStatsDisplay() {
            updateStatsDisplay();
            detailedStatsList.innerHTML = '';
            
            for (const [catName, catData] of Object.entries(CHORD_CATEGORIES)) {
                const catKeys = [];
                catData.subgroups.forEach(sub => {
                    if (sub.isMajorMinorRows) {
                        const majKeys = ['scale_nat_maj', 'scale_harm_maj', 'scale_mel_maj'];
                        const minKeys = ['scale_nat_min', 'scale_harm_min', 'scale_mel_min'];
                        sub.rows.forEach((row, idx) => {
                            catKeys.push(majKeys[idx], minKeys[idx]);
                        });
                    } else if (sub.chords) {
                        for (const key in sub.chords) catKeys.push(key);
                    }
                });

                const activeItemsInCat = catKeys.filter(k => chordStats[k].total > 0);
                if (activeItemsInCat.length === 0) continue;

                const categorySection = document.createElement('div');
                categorySection.className = 'space-y-1.5 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800';

                const catHeader = document.createElement('div');
                catHeader.className = 'text-xs font-bold text-indigo-400 uppercase tracking-wider border-b border-slate-800 pb-1';
                catHeader.textContent = catName;
                categorySection.appendChild(catHeader);

                const itemsGrid = document.createElement('div');
                itemsGrid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-1.5 pt-1';

                catKeys.forEach(key => {
                    const st = chordStats[key];
                    if (st.total === 0) return;
                    const acc = Math.round((st.correct / st.total) * 100);
                    const item = document.createElement('div');
                    item.className = 'bg-slate-900 p-2 rounded-lg border border-slate-800 flex justify-between items-center text-xs';
                    item.innerHTML = `
                        <span class="text-slate-300 truncate pr-2 font-medium">${ALL_CHORDS[key].name || ALL_CHORDS[key].rawShort}</span>
                        <span class="font-bold text-indigo-300 whitespace-nowrap">${st.correct}/${st.total} (${acc}%)</span>
                    `;
                    itemsGrid.appendChild(item);
                });

                categorySection.appendChild(itemsGrid);
                detailedStatsList.appendChild(categorySection);
            }

            if (detailedStatsList.children.length === 0) {
                detailedStatsList.innerHTML = '<div class="text-center text-slate-500 py-6 italic">Статистика пока пуста. Начните отвечать!</div>';
            }
        }

        playBtn.onclick = () => {
            stopActiveNotes();
            playbackTimer = setTimeout(() => {
                prepareNewQuestion();
                playCurrentChord();
            }, 60);
        };

        repeatBtn.onclick = () => {
            stopActiveNotes();
            playbackTimer = setTimeout(() => {
                playCurrentChord();
            }, 60);
        };

        resetStatsBtn.onclick = () => {
            stats.correct = 0;
            stats.total = 0;
            for (const key in chordStats) {
                chordStats[key] = { correct: 0, total: 0 };
            }
            updateDetailedStatsDisplay();
            prepareNewQuestion();
            saveUserData();
        };

        document.addEventListener('keydown', (e) => {
            if (!chordSettingsModal.classList.contains('hidden') || !detailedStatsBox.classList.contains('hidden')) return;
            if (e.code === 'Space') {
                e.preventDefault();
                stopActiveNotes();
                playbackTimer = setTimeout(() => {
                    playCurrentChord();
                }, 60);
            }
        });

        window.onload = async () => {
            initChordCheckboxes();
            updateStatsDisplay();
            renderAnswerButtons();
            chordSettingsModal.classList.add('hidden');
            detailedStatsBox.classList.add('hidden');
            await initFirebase();
            prepareNewQuestion();
        };
    </script>
</body>
</html>
